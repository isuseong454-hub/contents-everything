<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>분해봇 공정 — 시안 3안</title>
<style>
:root{
  --bg0:#050609; --hook:#B9A9F6; --story:#8EC7F6; --conv:#6FE0C8; --prod:#C8F169;
  --tx1:#EDF0F6; --tx2:#8B93A3; --tx3:#5A6272;
  --glass:rgba(255,255,255,.035); --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.15);
  --yt:#E0574B; --ig:#D62976;
  --ease:cubic-bezier(.22,.61,.36,1); --spring:cubic-bezier(.32,1.4,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--tx1);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(120% 70% at 50% 0%, #0d1017, #070910 54%, #050609);min-height:100vh;padding:20px 16px 80px}
.wrap{max-width:1120px;margin:0 auto}
h1{font-size:22px;letter-spacing:-.02em;margin:0 0 6px}
.lead{color:var(--tx2);font-size:12.5px;line-height:1.65;margin:0 0 16px;max-width:70ch}
.lead b{color:var(--prod)}
.allbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.allbar button{font-family:inherit;font-size:12.5px;font-weight:800;padding:10px 16px;border-radius:11px;cursor:pointer;
  background:var(--prod);border:none;color:#06080c;transition:.16s var(--ease)}
.allbar button:active{transform:scale(.97)}
.allbar button.ghost{background:var(--glass);border:1px solid var(--line2);color:var(--tx2)}
.allbar s{text-decoration:none;font-size:11px;color:var(--tx3);margin-left:2px}

.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){ .grid{grid-template-columns:repeat(3,1fr)} }
.card{border:1px solid var(--line);border-radius:20px;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.022),transparent 40%)}
.chd{padding:13px 15px;border-bottom:1px solid var(--line)}
.chd b{font-size:13px;font-weight:800;display:block}
.chd s{text-decoration:none;font-size:10.5px;color:var(--tx3);line-height:1.5;display:block;margin-top:3px}
.ctl{display:flex;gap:5px;padding:11px 15px 0}
.ctl button{flex:1;font-family:inherit;font-size:11px;font-weight:800;padding:7px 0;border-radius:9px;cursor:pointer;
  background:var(--glass);border:1px solid var(--line);color:var(--tx2);transition:.16s var(--ease)}
.ctl button:active{transform:scale(.96)}
.ctl button.yt{color:#FF7A6E;border-color:rgba(224,87,75,.36)}
.ctl button.ig{color:#F06FB8;border-color:rgba(214,41,118,.36)}
.ctl button[disabled]{opacity:.4;cursor:default}
.scene{position:relative;height:270px;margin:8px 0 0}
.scene svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.state{text-align:center;font-size:10.5px;font-weight:700;color:var(--tx3);padding:2px 12px 0;min-height:16px;
  transition:color .3s}
.card.run .state{color:var(--story)}
.card.done .state{color:var(--prod)}
/* 결과 카드 — 봇이 «뱉으면» 아래에 생긴다 */
.out{padding:0 15px 15px;min-height:96px}
.outcard{display:flex;gap:10px;align-items:center;padding:9px;border-radius:13px;
  background:rgba(200,241,105,.06);border:1px solid rgba(200,241,105,.26);
  animation:spit .52s var(--spring) 1 both}
@keyframes spit{ from{opacity:0;transform:translateY(-16px) scale(.9)} to{opacity:1;transform:none} }
.outcard i{width:34px;height:46px;border-radius:8px;flex:none;background:var(--g);box-shadow:0 6px 16px rgba(0,0,0,.5)}
.outcard .tt{min-width:0}
.outcard .tt b{display:block;font-size:11.5px;font-weight:800;line-height:1.35}
.outcard .tt s{display:block;text-decoration:none;font-size:9.5px;color:var(--prod);margin-top:3px;font-weight:700}
.outempty{font-size:10.5px;color:var(--tx3);text-align:center;padding:30px 10px;line-height:1.6;
  border:1px dashed var(--line);border-radius:13px}

/* ── 공통 SVG 조각 ── */
.pipe{stroke:rgba(255,255,255,.1);stroke-width:2.4;fill:none;stroke-linecap:round}
.flow{stroke-width:2.8;fill:none;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);opacity:0}
.card.run .flow.on{opacity:1;animation:flow 1.05s var(--ease) 1 forwards}
@keyframes flow{ to{stroke-dashoffset:0} }
.port{transition:.35s var(--ease)}
.port .pbg{transition:.35s var(--ease)}
.card.run .port.on .pbg{filter:brightness(1.25)}
.plabel{font:800 9px/1 -apple-system,system-ui;fill:var(--tx3);letter-spacing:.02em}
.card.run .port.on .plabel{fill:var(--tx1)}

/* ══ A · 공장 라인 ══ */
#A .body{transition:transform .3s var(--ease)}
.card.run #A .body{animation:shake .34s ease-in-out 4 both}
@keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-1.6px)} 75%{transform:translateX(1.6px)} }
#A .lamp{fill:#2a3040;transition:fill .3s}
.card.run #A .lamp{fill:var(--story)}
.card.done #A .lamp{fill:var(--prod)}
#A .belt{stroke:rgba(255,255,255,.14);stroke-width:2;stroke-dasharray:5 6}
.card.run #A .belt{animation:belt .9s linear 3 both;stroke:rgba(142,199,246,.5)}
@keyframes belt{ to{stroke-dashoffset:-22} }
#A .drop{opacity:0}
.card.done #A .drop{animation:drop .5s var(--spring) 1 both}
@keyframes drop{ from{opacity:0;transform:translateY(-14px)} to{opacity:1;transform:translateY(0)} }

/* ══ B · 회로 ══ */
#B .core{transform-origin:center;transition:.4s var(--ease)}
#B .ring{stroke:rgba(255,255,255,.13);fill:none;stroke-width:1.6}
.card.run #B .ring{stroke:var(--story);animation:spin 1.1s linear 2 both;transform-origin:50% 50%}
@keyframes spin{ to{transform:rotate(360deg)} }
#B .dot{opacity:0}
.card.run #B .dot{animation:pulse 1.5s var(--ease) 2 both}
@keyframes pulse{ 0%{opacity:.2;r:2} 50%{opacity:1;r:3.4} 100%{opacity:.2;r:2} }
#B .hex{fill:rgba(255,255,255,.03);stroke:rgba(255,255,255,.14);stroke-width:1.6;transition:.4s var(--ease)}
.card.run #B .hex{fill:rgba(142,199,246,.1);stroke:var(--story)}
.card.done #B .hex{fill:rgba(200,241,105,.12);stroke:var(--prod)}
#B .outray{stroke:var(--prod);stroke-width:2.2;fill:none;stroke-dasharray:60;stroke-dashoffset:60;opacity:0}
.card.done #B .outray{opacity:1;animation:flow .5s var(--ease) 1 forwards}

/* ══ C · 로봇 ══ */
#C .rob{transform-origin:0px 40px;transition:transform .4s var(--spring)}
.card.run #C .rob{animation:tilt .6s ease-in-out 3 both;transform-origin:0px 40px}
@keyframes tilt{ 0%,100%{transform:rotate(0)} 30%{transform:rotate(-2.6deg)} 70%{transform:rotate(2.6deg)} }
#C .eye{fill:#2a3040;transition:fill .3s,ry .3s}
.card.run #C .eye,.card.done #C .eye{fill:var(--prod)}
#C .zzz{fill:var(--tx3);font:800 11px/1 -apple-system,system-ui;transition:opacity .3s}
.card.run #C .zzz,.card.done #C .zzz{opacity:0}
#C .think{opacity:0}
.card.run #C .think{animation:think 1.4s ease-in-out 2 both}
@keyframes think{ 0%{opacity:0} 30%{opacity:1} 100%{opacity:0} }
#C .arm{transform-origin:21px 18px;transition:transform .4s var(--ease)}
.card.run #C .arm{animation:armw .5s ease-in-out 4 both;transform-origin:21px 18px}
@keyframes armw{ 0%,100%{transform:rotate(0)} 50%{transform:rotate(-16deg)} }
#C .sheet{opacity:0}
.card.done #C .sheet{animation:sheet .55s var(--spring) 1 both}
@keyframes sheet{ from{opacity:0;transform:translateY(-8px) scaleY(.4)} to{opacity:1;transform:none} }
.card.done #C .mouth{transform:scaleX(1.35);transform-origin:center}

@media(prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;transition-duration:.01ms!important} }
</style>
</head>
<body>
<div class="wrap">
  <h1>분해봇 공정 — 시안 3안</h1>
  <p class="lead">축은 <b>「봇을 무엇으로 그리나」</b>입니다 — 기계 / 신호 / 사람.
     셋 다 <b>꺼져 있음 → 일함 → 뱉음</b> 세 상태를 갖고, 평소에는 <b>애니메이션이 0개</b>입니다(발열 헌법).
     모션 비교라 <b>나란히 놓고 동시에</b> 돌립니다.</p>

  <div class="allbar">
    <button data-all="yt">▶ 유튜브 넣기 — 셋 다</button>
    <button data-all="ig">◉ 인스타 넣기 — 셋 다</button>
    <button class="ghost" data-reset="1">처음으로</button>
    <s>인스타는 받아쓰기까지 하므로 더 오래 걸리게 그렸습니다</s>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
var ANS = [
  {id:'A', nm:'A · 공장 라인', sub:'봇 = 기계. 파이프로 내려와 컨베이어를 타고 아래로 툭 떨어진다'},
  {id:'B', nm:'B · 신호 회로', sub:'봇 = 코어. 선을 따라 빛이 흘러 들어가고, 처리되면 빛으로 나온다'},
  {id:'C', nm:'C · 작업하는 로봇', sub:'봇 = 사람. 자고 있다가 눈을 뜨고 팔을 움직이고, 종이를 내민다'}
];
var OUT = {
  yt:{g:'linear-gradient(150deg,#3a2f12,#1d1707)', t:'3초 안에 안 넘기게 하는 법', s:'원고 217자 · 구성 6칸'},
  ig:{g:'linear-gradient(150deg,#331a2e,#1a0d17)', t:'브이로그인데 왜 이건 터졌을까', s:'받아쓰기 412자 · 구성 5칸'}
};
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ── 입구(유튜브·인스타) 공통 그림 ── */
function portSVG(x, kind){
  var col = kind==='yt' ? 'var(--yt)' : 'var(--ig)';
  var ico = kind==='yt'
    ? '<path d="M'+(x-3.4)+' -4.6v9.2l7.6-4.6z" fill="#fff"/>'
    : '<g fill="none" stroke="#fff" stroke-width="1.9" stroke-linejoin="round">'+
      '<rect x="'+(x-6.2)+'" y="-6.2" width="12.4" height="12.4" rx="3.9"/>'+
      '<circle cx="'+x+'" cy="0" r="2.9"/></g>';
  return '<g class="port '+kind+'" data-port="'+kind+'">'+
    '<rect class="pbg" x="'+(x-17)+'" y="-17" width="34" height="34" rx="11" fill="'+col+'"/>'+
    '<g transform="translate(0,0)">'+ico+'</g>'+
    '<text class="plabel" x="'+x+'" y="30" text-anchor="middle">'+(kind==='yt'?'유튜브':'인스타')+'</text></g>';
}

/* ══ A · 공장 라인 ══ */
function sceneA(){
  return '<svg viewBox="0 0 300 270" id="A">'+
    '<g transform="translate(0,34)">'+portSVG(78,'yt')+portSVG(222,'ig')+'</g>'+
    /* 파이프 */
    '<path class="pipe" d="M78 68 V104 Q78 118 96 118 H150"/>'+
    '<path class="pipe" d="M222 68 V104 Q222 118 204 118 H150"/>'+
    '<path class="pipe" d="M150 118 V138"/>'+
    '<path class="flow yt" style="--len:120" stroke="var(--yt)" d="M78 68 V104 Q78 118 96 118 H150 V138"/>'+
    '<path class="flow ig" style="--len:120" stroke="var(--ig)" d="M222 68 V104 Q222 118 204 118 H150 V138"/>'+
    /* 기계 본체 */
    '<g class="body">'+
      '<rect x="98" y="138" width="104" height="58" rx="13" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,.16)" stroke-width="1.5"/>'+
      '<circle class="lamp" cx="114" cy="152" r="4"/>'+
      '<line class="belt" x1="110" y1="176" x2="190" y2="176"/>'+
      '<text x="150" y="160" text-anchor="middle" font-size="10" font-weight="800" fill="var(--tx2)">분해봇</text>'+
    '</g>'+
    /* 출구 + 떨어지는 것 */
    '<path class="pipe" d="M150 196 V214"/>'+
    '<g class="drop"><rect x="132" y="214" width="36" height="26" rx="6" fill="rgba(200,241,105,.16)" stroke="var(--prod)" stroke-width="1.4"/>'+
    '<line x1="139" y1="223" x2="161" y2="223" stroke="var(--prod)" stroke-width="1.6" stroke-linecap="round"/>'+
    '<line x1="139" y1="230" x2="154" y2="230" stroke="var(--prod)" stroke-width="1.6" stroke-linecap="round"/></g>'+
    '</svg>';
}
/* ══ B · 신호 회로 ══ */
function sceneB(){
  return '<svg viewBox="0 0 300 270" id="B">'+
    '<g transform="translate(0,34)">'+portSVG(78,'yt')+portSVG(222,'ig')+'</g>'+
    '<path class="pipe" d="M78 68 V96 L150 132"/>'+
    '<path class="pipe" d="M222 68 V96 L150 132"/>'+
    '<path class="flow yt" style="--len:110" stroke="var(--yt)" d="M78 68 V96 L150 132"/>'+
    '<path class="flow ig" style="--len:110" stroke="var(--ig)" d="M222 68 V96 L150 132"/>'+
    '<g transform="translate(150,166)">'+
      '<polygon class="hex" points="0,-32 28,-16 28,16 0,32 -28,16 -28,-16"/>'+
      '<circle class="ring" cx="0" cy="0" r="19" stroke-dasharray="30 14"/>'+
      '<circle class="dot" cx="0" cy="0" r="2.6" fill="var(--story)"/>'+
      '<text y="4" text-anchor="middle" font-size="9.5" font-weight="800" fill="var(--tx2)">분해봇</text>'+
    '</g>'+
    '<path class="outray" d="M150 198 V226"/>'+
    '</svg>';
}
/* ══ C · 로봇 ══ */
function sceneC(){
  return '<svg viewBox="0 0 300 270" id="C">'+
    '<g transform="translate(0,34)">'+portSVG(78,'yt')+portSVG(222,'ig')+'</g>'+
    '<path class="pipe" d="M78 68 Q78 106 118 112"/>'+
    '<path class="pipe" d="M222 68 Q222 106 182 112"/>'+
    '<path class="flow yt" style="--len:90" stroke="var(--yt)" d="M78 68 Q78 106 118 112"/>'+
    '<path class="flow ig" style="--len:90" stroke="var(--ig)" d="M222 68 Q222 106 182 112"/>'+
    '<g transform="translate(150,142) scale(1.18)"><g class="rob">'+
      /* 생각 점 */
      '<g class="think"><circle cx="-8" cy="-52" r="2.4" fill="var(--story)"/>'+
      '<circle cx="0" cy="-56" r="3" fill="var(--story)"/><circle cx="9" cy="-52" r="2.4" fill="var(--story)"/></g>'+
      '<text class="zzz" x="26" y="-44">z z</text>'+
      /* 머리 */
      '<rect x="-30" y="-38" width="60" height="46" rx="15" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.17)" stroke-width="1.6"/>'+
      '<ellipse class="eye" cx="-11" cy="-17" rx="4.2" ry="4.2"/>'+
      '<ellipse class="eye" cx="11" cy="-17" rx="4.2" ry="4.2"/>'+
      '<rect class="mouth" x="-7" y="-4" width="14" height="3.2" rx="1.6" fill="rgba(255,255,255,.28)"/>'+
      /* 몸통 + 팔 */
      '<rect x="-22" y="12" width="44" height="30" rx="10" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.15)" stroke-width="1.5"/>'+
      '<g transform="translate(0,0)"><g class="arm"><rect x="20" y="16" width="16" height="5" rx="2.5" fill="rgba(255,255,255,.16)"/></g></g>'+
      '<rect x="-36" y="16" width="16" height="5" rx="2.5" fill="rgba(255,255,255,.16)"/>'+
      /* 뱉는 종이 */
      '<g class="sheet"><rect x="-16" y="44" width="32" height="24" rx="5" fill="rgba(200,241,105,.15)" stroke="var(--prod)" stroke-width="1.4"/>'+
      '<line x1="-10" y1="52" x2="10" y2="52" stroke="var(--prod)" stroke-width="1.5" stroke-linecap="round"/>'+
      '<line x1="-10" y1="59" x2="3" y2="59" stroke="var(--prod)" stroke-width="1.5" stroke-linecap="round"/></g>'+
    '</g></g></svg>';
}
var SCENES = {A:sceneA, B:sceneB, C:sceneC};

document.getElementById('grid').innerHTML = ANS.map(function(a){
  return '<section class="card" data-an="'+a.id+'">'+
    '<div class="chd"><b>'+a.nm+'</b><s>'+a.sub+'</s></div>'+
    '<div class="ctl"><button class="yt" data-run="'+a.id+'|yt">▶ 유튜브</button>'+
    '<button class="ig" data-run="'+a.id+'|ig">◉ 인스타</button></div>'+
    '<div class="scene">'+SCENES[a.id]()+'</div>'+
    '<p class="state" data-state="'+a.id+'">꺼져 있음 — 일감이 오면 깨어납니다</p>'+
    '<div class="out" data-out="'+a.id+'"><div class="outempty">여기로 결과가 나옵니다</div></div>'+
    '</section>';
}).join('');

var timers = {};
function reset(id){
  var c=document.querySelector('[data-an="'+id+'"]'); if(!c) return;
  clearTimeout(timers[id]); clearTimeout(timers[id+'b']);
  c.classList.remove('run','done');
  c.querySelectorAll('.flow').forEach(function(f){ f.classList.remove('on'); });
  c.querySelectorAll('.port').forEach(function(p){ p.classList.remove('on'); });
  c.querySelector('[data-state="'+id+'"]').textContent='꺼져 있음 — 일감이 오면 깨어납니다';
  c.querySelector('[data-out="'+id+'"]').innerHTML='<div class="outempty">여기로 결과가 나옵니다</div>';
  c.querySelectorAll('.ctl button').forEach(function(b){ b.disabled=false; });
}
function run(id, kind){
  var c=document.querySelector('[data-an="'+id+'"]'); if(!c) return;
  reset(id);
  var ig = kind==='ig', dur = ig ? 4200 : 2600;   /* 인스타는 받아쓰기까지 — 더 오래 */
  c.querySelectorAll('.ctl button').forEach(function(b){ b.disabled=true; });
  c.querySelector('.port.'+kind).classList.add('on');
  c.querySelector('.flow.'+kind).classList.add('on');
  /* 브라우저가 애니를 다시 물게 한다 */
  void c.offsetWidth;
  c.classList.add('run');
  c.querySelector('[data-state="'+id+'"]').textContent =
    ig ? '받아쓰는 중… 인스타는 소리부터 글자로' : '자막을 읽는 중…';
  timers[id]=setTimeout(function(){
    c.querySelector('[data-state="'+id+'"]').textContent='구성으로 뜯는 중…';
  }, Math.round(dur*0.55));
  timers[id+'b']=setTimeout(function(){
    c.classList.remove('run'); c.classList.add('done');
    c.querySelector('[data-state="'+id+'"]').textContent='끝났습니다 — 아래로 나왔어요';
    var o=OUT[kind];
    c.querySelector('[data-out="'+id+'"]').innerHTML =
      '<div class="outcard"><i style="--g:'+o.g+';background:'+o.g+'"></i>'+
      '<div class="tt"><b>'+esc(o.t)+'</b><s>'+esc(o.s)+'</s></div></div>';
    c.querySelectorAll('.ctl button').forEach(function(b){ b.disabled=false; });
  }, dur);
}
document.addEventListener('click', function(e){
  var r=e.target.closest('[data-run]');
  if(r){ var p=r.dataset.run.split('|'); run(p[0],p[1]); return; }
  var a=e.target.closest('[data-all]');
  if(a){ ANS.forEach(function(x){ run(x.id, a.dataset.all); }); return; }
  if(e.target.closest('[data-reset]')){ ANS.forEach(function(x){ reset(x.id); }); return; }
});
</script>
</body>
</html>
