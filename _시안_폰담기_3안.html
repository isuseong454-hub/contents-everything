<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>폰 빠른 담기 — 3가지 마법</title>
<style>
:root{
  --tx1:#EDF0F6; --tx2:#8B93A3; --tx3:#5A6272;
  --glass:rgba(255,255,255,.035); --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.15);
  --prod:#C8F169; --rust:#C98A5B;
  --ease:cubic-bezier(.22,.61,.36,1); --sp:cubic-bezier(.32,1.4,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--tx1);font:100%/1.5 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(120% 70% at 50% 0%, #0d1017, #070910 54%, #050609);min-height:100vh;padding:20px 14px 80px}
.wrap{max-width:1060px;margin:0 auto}
h1{font-size:clamp(20px,3vw,24px);letter-spacing:-.02em;margin:0 0 6px}
.lead{color:var(--tx2);font-size:12.5px;line-height:1.65;margin:0 0 14px;max-width:74ch}
.lead b{color:var(--prod)}
.bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:18px;position:sticky;top:0;z-index:9;
  background:linear-gradient(180deg,#070910 62%,transparent);padding:6px 0 10px}
.bar button{font-family:inherit;font-size:12.5px;font-weight:800;padding:10px 16px;border-radius:11px;cursor:pointer;
  background:var(--prod);border:none;color:#06080c}
.bar button:active{transform:scale(.97)}
.bar s{text-decoration:none;font-size:11px;color:var(--tx3)}

.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:620px){ .grid{grid-template-columns:repeat(3,1fr)} }
.card{border:1px solid var(--line);border-radius:20px;padding:14px 14px 15px;position:relative;
  background:linear-gradient(180deg,rgba(255,255,255,.022),transparent 40%)}
.card.rec{border-color:rgba(200,241,105,.32)}
.tag{position:absolute;right:12px;top:12px;font-size:9px;font-weight:800;padding:3px 8px;border-radius:7px;
  background:rgba(255,255,255,.07);color:var(--tx3);border:1px solid var(--line)}
.card.rec .tag{background:rgba(200,241,105,.14);color:var(--prod);border-color:rgba(200,241,105,.34)}
.chd b{font-size:13.5px;font-weight:800;display:block}
.chd s{text-decoration:none;font-size:10.5px;color:var(--tx3);display:block;margin:3px 0 12px;line-height:1.5}

/* ── 아이폰 틀 ── */
.ph{width:min(100%,216px);aspect-ratio:216/438;height:auto;margin:0 auto;border-radius:34px;position:relative;overflow:hidden;
  border:2.5px solid rgba(255,255,255,.16);background:#000;
  box-shadow:0 18px 44px rgba(0,0,0,.55), inset 0 0 0 1.5px rgba(0,0,0,.9)}
.ph::before{content:"";position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:40;
  width:64px;height:17px;border-radius:10px;background:#000}
.scene{position:absolute;inset:0;opacity:0;transition:opacity .4s var(--ease);pointer-events:none}
.scene.on{opacity:1}

/* 인스타 릴스 화면 */
.reel{background:linear-gradient(165deg,#3d2f63,#1b1533 55%,#120e22)}
.reel .who{position:absolute;left:12px;bottom:86px;font-size:10px;font-weight:800}
.reel .who i{display:inline-block;width:20px;height:20px;border-radius:50%;vertical-align:-6px;margin-right:5px;
  background:linear-gradient(45deg,#FEDA75,#D62976)}
.reel .cap{position:absolute;left:12px;bottom:64px;right:64px;font-size:9.5px;color:#cfd4e2;line-height:1.45}
.reel .rail{position:absolute;right:10px;bottom:70px;display:flex;flex-direction:column;gap:15px;text-align:center}
.reel .rail b{font-size:17px;display:block;line-height:1}
.reel .rail s{text-decoration:none;font-size:8px;color:#cfd4e2;display:block;margin-top:2px}
.reel .share{transition:transform .3s var(--sp)}
.scene.tapshare .share{transform:scale(1.45)}
.scene.tapshare .share b{color:var(--prod)}
.pill{position:absolute;left:50%;top:52px;transform:translateX(-50%);font-size:9px;font-weight:800;
  padding:5px 10px;border-radius:9px;background:rgba(10,12,18,.88);border:1px solid var(--line2);
  color:var(--prod);white-space:nowrap}

/* 공유 시트 */
.sheet{position:absolute;left:0;right:0;bottom:0;border-radius:18px 18px 0 0;background:#15181f;
  border-top:1px solid var(--line2);padding:11px 11px 13px;transform:translateY(102%);transition:transform .45s var(--sp)}
.scene.on .sheet{transform:none}
.sheet .apps{display:flex;gap:9px;margin-bottom:11px}
.sheet .apps i{width:37px;height:37px;border-radius:10px;background:#242936;display:grid;place-items:center;font-size:15px;font-style:normal}
.sheet .row{display:flex;align-items:center;gap:8px;padding:9px 9px;border-radius:10px;font-size:10.5px;font-weight:800}
.sheet .row.hot{background:rgba(200,241,105,.13);border:1px solid rgba(200,241,105,.4);color:var(--prod)}
.sheet .row.dim{color:var(--tx3);font-weight:700}
.sheet .row em{font-style:normal;width:20px;text-align:center}
.tapdot{position:absolute;width:34px;height:34px;border-radius:50%;border:2.5px solid var(--prod);opacity:0;z-index:30}
.scene.on .tapdot{animation:tap 1.1s .55s var(--ease) 1 both}
@keyframes tap{ 0%{opacity:0;transform:scale(.4)} 25%{opacity:.95;transform:scale(1)} 100%{opacity:0;transform:scale(1.5)} }

/* 물음 한 줄 */
.ask{background:#0b0e15;display:grid;place-items:center}
.ask .box{width:82%;border:1px solid var(--line2);border-radius:15px;background:#171b24;padding:13px 12px;text-align:center}
.ask .box b{font-size:11px;display:block;margin-bottom:9px}
.ask .box i{display:block;font-style:normal;text-align:left;font-size:10px;padding:8px 9px;border-radius:9px;
  background:#0d1017;border:1px solid var(--line);color:var(--prod);min-height:31px}
.ask .box i::after{content:"";display:inline-block;width:1.5px;height:11px;background:var(--prod);
  vertical-align:-2px;margin-left:2px;animation:blink 0.9s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ask .ok{margin-top:9px;display:flex;gap:6px}
.ask .ok u{flex:1;text-decoration:none;font-size:10px;font-weight:800;padding:8px 0;border-radius:9px;text-align:center}
.ask .ok u.y{background:var(--prod);color:#06080c}
.ask .ok u.n{background:var(--glass);color:var(--tx3);border:1px solid var(--line)}
.ask .skip{margin-top:8px;font-size:8.5px;color:var(--tx3)}

/* 컨모 담김 화면 */
.done{background:radial-gradient(100% 70% at 50% 0%,#10141d,#070910)}
.done .top{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:10px;font-weight:800;color:var(--tx2)}
.done .card2{position:absolute;left:14px;top:58px;width:84px;border-radius:11px;overflow:hidden;
  border:1px solid rgba(200,241,105,.4);background:#141126;transform:translateY(-10px);opacity:0;
  transition:.5s var(--sp) .35s}
.scene.on .card2{transform:none;opacity:1}
.done .card2 i{display:block;aspect-ratio:9/12;background:linear-gradient(165deg,#3d2f63,#1b1533)}
.done .card2 p{margin:0;padding:5px 6px;font-size:8px;font-weight:700;line-height:1.35}
.done .toast{position:absolute;left:10px;right:10px;bottom:16px;border-radius:12px;padding:9px 11px;
  background:rgba(200,241,105,.13);border:1px solid rgba(200,241,105,.42);color:var(--prod);
  font-size:9.5px;font-weight:800;line-height:1.5;transform:translateY(14px);opacity:0;transition:.45s var(--sp) .2s}
.scene.on .toast{transform:none;opacity:1}

/* 알림 배너 (B·C 마무리) */
.ban{position:absolute;left:8px;right:8px;top:30px;border-radius:13px;padding:9px 11px;display:flex;gap:8px;align-items:center;
  background:rgba(23,27,36,.97);border:1px solid var(--line2);transform:translateY(-130%);transition:transform .5s var(--sp)}
.scene.on .ban{transform:none}
.ban i{font-style:normal;width:26px;height:26px;border-radius:8px;background:rgba(200,241,105,.16);
  display:grid;place-items:center;font-size:13px;flex:none}
.ban div b{display:block;font-size:9.5px}
.ban div s{text-decoration:none;font-size:8.5px;color:var(--tx3);line-height:1.35;display:block}

/* B — 복사 + 뒷면 톡톡 */
.scene.knock .kn{position:absolute;right:-6px;top:46%;font-size:22px;animation:kn .55s var(--ease) 2 both}
@keyframes kn{ 0%,100%{transform:translateX(0)} 40%{transform:translateX(-9px)} }
.card .ph.shake{animation:phsh .55s var(--ease) 2 both}
@keyframes phsh{ 0%,100%{transform:none} 30%{transform:rotate(1.6deg) translateX(3px)} 65%{transform:rotate(-1.2deg) translateX(-2px)} }

/* C — 시리 */
.lock{background:radial-gradient(90% 60% at 50% 20%,#1a2033,#0a0d16)}
.lock .clock{position:absolute;left:0;right:0;top:64px;text-align:center;font-size:38px;font-weight:300;letter-spacing:.02em}
.lock .date{position:absolute;left:0;right:0;top:46px;text-align:center;font-size:10px;color:var(--tx2)}
.orb{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);width:52px;height:52px;border-radius:50%;
  background:conic-gradient(from 0deg,#7EC8F5,#C7B6FF,#F09EB8,#C8F169,#7EC8F5);filter:blur(1px);opacity:0}
.scene.on .orb{opacity:1;animation:orb 1.6s linear infinite}
@keyframes orb{ 0%{transform:translateX(-50%) rotate(0) scale(1)} 50%{transform:translateX(-50%) rotate(180deg) scale(1.12)} 100%{transform:translateX(-50%) rotate(360deg) scale(1)} }
.saytxt{position:absolute;left:14px;right:14px;bottom:96px;text-align:center;font-size:12px;font-weight:800;line-height:1.55}
.saytxt s{text-decoration:none;color:var(--tx3);font-size:9.5px;font-weight:700;display:block;margin-top:4px}

/* 자막 · 단계 점 */
.capline{margin:13px 4px 2px;min-height:52px}
.capline b{font-size:11.5px;display:block;line-height:1.45}
.capline s{text-decoration:none;font-size:10px;color:var(--tx3);line-height:1.5;display:block;margin-top:2px}
.dots{display:flex;gap:5px;margin-top:9px}
.dots i{flex:1;height:3.5px;border-radius:3px;background:rgba(255,255,255,.1)}
.dots i.on{background:var(--prod)}
.spec{margin-top:12px}
.spec div{display:flex;gap:8px;font-size:10.5px;line-height:1.7;color:var(--tx3);border-top:1px solid var(--line);padding-top:6px}
.spec div:first-child{border-top:0}
.spec b{flex:none;width:64px;color:var(--tx2);font-weight:800}

.after{margin-top:18px;border:1px dashed var(--line2);border-radius:17px;padding:14px 16px;
  display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.after b{font-size:12.5px}
.after p{margin:2px 0 0;font-size:11px;color:var(--tx3);line-height:1.6;flex:1;min-width:220px}
.after p em{font-style:normal;color:var(--prod);font-weight:800}
.after .rb{font-size:30px}
@media(prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;transition-duration:.01ms!important} }
</style>
</head>
<body>
<div class="wrap">
  <h1>폰 빠른 담기 — 3가지 마법</h1>
  <p class="lead">인스타를 보다가 「오 이거다」 싶은 순간, <b>폰에서 몇 번 만에 컨모에 담기는지</b>를
     세 방법이 나란히 시연합니다. 셋 다 같은 곳에 도착합니다 — 다른 건 <b>«방아쇠»</b>뿐입니다.</p>
  <div class="bar">
    <button data-play="1">▶ 셋 다 동시에 재생</button>
    <s>실제 화면 흐름 그대로 — 아이폰 세 대가 같이 움직입니다</s>
  </div>

  <div class="grid" id="grid"></div>

  <div class="after">
    <span class="rb">🤖</span>
    <div style="flex:1;min-width:220px">
      <b>담긴 다음은? — 셋 다 똑같습니다</b>
      <p>폰에서 담은 건 서버에 잠깐 앉아 있다가, <em>맥북에서 컨모를 여는 순간 자동으로 금고로 이사</em>합니다.
         그때 덜컹이가 깨어나 원고·태그까지 가져옵니다. 폰에서는 담기만 — 무거운 일은 전부 맥북이 합니다.</p>
    </div>
  </div>
</div>

<script>
/* ── 세 대의 아이폰 — 각자 장면 목록과 시간표를 가진다 ── */
var CARDS=[
 {id:'A', rec:1, tag:'추천 · 기본기', nm:'A안 — 공유 버튼', sub:'인스타의 비행기(공유)에서 바로. 메모 한 줄까지 남길 수 있다',
  spec:[['누르는 수','2번 (메모 적으면 +한 줄)'],['시작하는 곳','보던 그 화면의 공유 버튼'],
        ['장점','«왜 좋았는지»가 훔칠 것에 남는다'],['준비','단축어 1개, 5분']],
  steps:[
    {t:0,    cap:['① 릴스를 보다가 「오 이거다」','오른쪽의 비행기(공유)를 누른다'], scene:'sA1', cls:'tapshare'},
    {t:2100, cap:['② 공유 시트가 올라온다','「컨모에 담기」를 누른다 — 끝이어도 된다'], scene:'sA2'},
    {t:4300, cap:['③ (내키면) 왜 좋았는지 한 줄','급하면 그냥 «건너뛰기» — 링크만 담긴다'], scene:'sA3'},
    {t:6600, cap:['④ 담겼다','한 줄은 컨모의 «훔칠 것» 칸에 앉는다'], scene:'sA4'}
  ]},
 {id:'B', tag:'과속용', nm:'B안 — 뒷면 톡톡', sub:'링크 복사 후 폰 뒷면을 두 번 톡톡. 화면 전환이 0번이다',
  spec:[['누르는 수','복사 1번 + 톡톡'],['시작하는 곳','어디서든 — 화면을 안 떠난다'],
        ['장점','릴스 넘기던 흐름이 안 끊긴다'],['준비','단축어 + 설정→손쉬운 사용→뒷면 탭']],
  steps:[
    {t:0,    cap:['① 공유에서 「링크 복사」','비행기 → 링크 복사. 화면은 그대로'], scene:'sB1'},
    {t:2600, cap:['② 폰 뒷면을 톡톡','두 번 두드리면 단축어가 클립보드를 읽는다'], scene:'sB2', cls:'knock', shake:1},
    {t:5200, cap:['③ 위에서 알림이 톡','릴스는 계속 보던 그대로'], scene:'sB3'}
  ]},
 {id:'C', tag:'손 없이', nm:'C안 — 시리', sub:'「시리야, 컨모에 담아」 — 말로. 요리하다가도 된다',
  spec:[['누르는 수','0번 (말 한마디)'],['시작하는 곳','잠금화면이어도 된다'],
        ['장점','손이 바쁠 때도 담긴다'],['준비','단축어 이름이 곧 명령어 — 추가 설정 0']],
  steps:[
    {t:0,    cap:['① 링크를 복사해 뒀다','(혹은 방금 공유 → 링크 복사)'], scene:'sC1'},
    {t:2600, cap:['② 「시리야, 컨모에 담아」','시리가 단축어를 그대로 돌린다'], scene:'sC2'},
    {t:5600, cap:['③ 담겼다','알림 한 줄로 확인'], scene:'sC3'}
  ]}
];

/* ── 장면 부품 ── */
function reel(extra){
  return '<div class="scene reel '+(extra||'')+'" data-s>'+
    '<span class="who"><i></i>wonjang_kim</span>'+
    '<p class="cap">1인 미용실의 현실적인 하루 매출 — 골목 안쪽 간판 없는 미용실도 이 정도는 나와야 삽니다</p>'+
    '<div class="rail"><span><b>♡</b><s>4.2만</s></span><span><b>💬</b><s>318</s></span>'+
    '<span class="share"><b>✈</b><s>공유</s></span></div></div>';
}
function sheetScene(){
  return '<div class="scene" data-s><div class="scene reel on" style="opacity:.35"></div>'+
    '<div class="sheet"><div class="apps"><i>💬</i><i>📷</i><i>✉️</i><i>🔗</i></div>'+
    '<div class="row hot">⚡ 컨모에 담기</div>'+
    '<div class="row dim"><em>➕</em>스토리에 추가</div><div class="row dim"><em>🔗</em>링크 복사</div></div>'+
    '<span class="tapdot" style="left:38px;bottom:78px"></span></div>';
}
function askScene(){
  return '<div class="scene ask" data-s><div class="box"><b>왜 좋았어?</b>'+
    '<i data-type>첫 컷이 통장</i>'+
    '<span class="ok"><u class="y">담기</u><u class="n">건너뛰기</u></span>'+
    '<span class="skip">급하면 그냥 담기 — 링크만 간다</span></div></div>';
}
function doneScene(msg){
  return '<div class="scene done" data-s><p class="top">컨모 · 담기</p>'+
    '<div class="card2"><i></i><p>1인 미용실의 현실적인 하루 매출…</p></div>'+
    '<div class="toast">🎬 담았어요 — 맥북을 열면 덜컹이가 원고까지 가져갑니다'+(msg||'')+'</div></div>';
}
function banScene(base, knock){
  return '<div class="scene '+(knock?'knock ':'')+'" data-s>'+
    '<div class="scene '+base+' on" style="opacity:.4"></div>'+
    (knock?'<span class="kn">👉</span>':'')+
    '<div class="ban"><i>⚡</i><div><b>컨모에 담았어요</b><s>맥북을 열면 덜컹이가 가져갑니다</s></div></div></div>';
}
function lockScene(say){
  return '<div class="scene lock" data-s><p class="date">8월 22일 금요일</p><p class="clock">9:41</p>'+
    (say?'<p class="saytxt">“시리야, 컨모에 담아”<s>단축어 이름이 곧 명령어입니다</s></p><span class="orb"></span>':'')+
    '</div>';
}

var SCENES={
  A:[ reel('tapshare'), sheetScene(), askScene(), doneScene() ],
  B:[ reel()+'', banScene('reel', true), banScene('reel') ],
  C:[ reel(), lockScene(true), banScene('lock') ]
};
/* B①에는 «링크 복사됨» 알약 */
SCENES.B[0]=SCENES.B[0].replace('</div></div>','</div><span class="pill">🔗 링크가 복사되었습니다</span></div>');

document.getElementById('grid').innerHTML = CARDS.map(function(c){
  return '<section class="card'+(c.rec?' rec':'')+'" data-an="'+c.id+'">'+
    '<span class="tag">'+c.tag+'</span>'+
    '<div class="chd"><b>'+c.nm+'</b><s>'+c.sub+'</s></div>'+
    '<div class="ph" data-ph>'+SCENES[c.id].join('')+'</div>'+
    '<div class="capline"><b data-c1>▶ 재생을 눌러보세요</b><s data-c2>세 대가 동시에 움직입니다</s></div>'+
    '<div class="dots">'+c.steps.map(function(){ return '<i></i>'; }).join('')+'</div>'+
    '<div class="spec">'+c.spec.map(function(r){
      return '<div><b>'+r[0]+'</b><span>'+r[1]+'</span></div>'; }).join('')+'</div>'+
  '</section>';
}).join('');

var timers=[];
function play(){
  timers.forEach(clearTimeout); timers=[];
  CARDS.forEach(function(c){
    var card=document.querySelector('[data-an="'+c.id+'"]');
    var scenes=card.querySelectorAll('[data-s]');
    var dots=card.querySelectorAll('.dots i');
    var ph=card.querySelector('[data-ph]');
    scenes.forEach(function(s){ s.classList.remove('on'); });
    dots.forEach(function(d){ d.classList.remove('on'); });
    c.steps.forEach(function(st,i){
      timers.push(setTimeout(function(){
        scenes.forEach(function(s,k){ s.classList.toggle('on', k===i); });
        if(st.cls) scenes[i].classList.add(st.cls);
        dots.forEach(function(d,k){ d.classList.toggle('on', k<=i); });
        card.querySelector('[data-c1]').textContent=st.cap[0];
        card.querySelector('[data-c2]').textContent=st.cap[1];
        if(st.shake){ ph.classList.remove('shake'); void ph.offsetWidth; ph.classList.add('shake'); }
      }, st.t));
    });
  });
}
document.addEventListener('click', function(e){
  if(e.target.closest('[data-play]')) play();
});
setTimeout(play, 700);   /* 열리면 한 번 자동 재생 */
</script>
</body>
</html>
