<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050609">
<title>관리자 · 컨텐츠의 모든것</title>
<style>
:root{
  --bg0:#050609; --bg1:#0a0d13;
  --ac1:#B9A9F6; --ac2:#8EC7F6; --ac3:#C8F169;
  --danger:#E07B7B;
  --tx1:#EDF0F6; --tx2:#8B93A3; --tx3:#5A6272;
  --glass:rgba(255,255,255,.035); --glass-hi:rgba(255,255,255,.10);
  --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.15);
  --r-lg:22px; --r-md:16px;
  --spring:cubic-bezier(.32,1.4,.36,1); --ease:cubic-bezier(.22,.61,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg0);color:var(--tx1);min-height:100dvh;letter-spacing:-.01em;
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font-family:inherit;font-size:16px}
.wrap{max-width:620px;margin:0 auto;padding:0 18px 60px}
/* 게이트 */
.gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--ac1) 14%,var(--bg0)),var(--bg0) 60%);padding:24px}
.g-card{width:min(360px,100%);background:var(--glass);border:1px solid var(--line);border-top-color:var(--glass-hi);
  border-radius:var(--r-lg);backdrop-filter:blur(24px);padding:34px 26px 26px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.g-mark{width:64px;height:64px;border-radius:20px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;
  font-size:28px;background:linear-gradient(135deg,var(--ac1),var(--ac2))}
.g-tt{text-align:center;font-size:20px;font-weight:800}
.g-sub{text-align:center;color:var(--tx2);font-size:13px;margin:6px 0 22px}
.g-card input{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:var(--r-md);
  color:var(--tx1);padding:14px 16px;margin-bottom:10px;outline:none;transition:border-color .2s}
.g-card input:focus{border-color:#fff}
.g-err{min-height:18px;font-size:12.5px;color:var(--danger);text-align:center;margin:2px 0 10px}
.g-btn{width:100%;padding:15px;border-radius:var(--r-md);font-size:16px;font-weight:800;color:#0A0F0A;
  background:linear-gradient(120deg,var(--ac3),#A8E23E);transition:transform .18s var(--spring)}
.g-btn:active{transform:scale(.95)}
.g-back{position:absolute;top:14px;right:16px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);
  font-size:12.5px;font-weight:800;color:var(--tx2);text-decoration:none}
/* 본체 */
.tb{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;background:color-mix(in srgb,var(--bg0) 72%,transparent);
  backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.tb b{font-size:16px;font-weight:800}
.tb a{padding:9px 14px;border-radius:12px;border:1px solid var(--line);font-size:13px;font-weight:700;
  color:var(--tx2);text-decoration:none;background:var(--glass)}
.card{background:var(--glass);border:1px solid var(--line);border-top-color:var(--glass-hi);
  border-radius:var(--r-lg);padding:18px;margin-top:16px}
.card h2{font-size:15.5px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card .hint{font-size:12px;color:var(--tx3);margin-top:10px;line-height:1.6}
.frow{display:flex;gap:9px}
.frow input{flex:1;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;
  color:var(--tx1);padding:13px 15px;outline:none;min-width:0}
.frow input:focus{border-color:#fff}
.gen{flex:none;padding:0 18px;border-radius:14px;font-weight:800;font-size:14px;color:#0A0F0A;
  background:linear-gradient(120deg,var(--ac3),#A8E23E);transition:transform .18s var(--spring)}
.gen:active{transform:scale(.93)}
/* 코드 카드 */
.cc{display:none;margin-top:14px;border-radius:18px;padding:20px;position:relative;overflow:hidden;
  background:linear-gradient(140deg,#12101f,#0b0e18 60%,#101623);border:1px solid var(--line2)}
.cc::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;
  background:linear-gradient(90deg,transparent,var(--ac1),var(--ac2),transparent)}
.cc .br{font-size:11px;font-weight:800;color:var(--tx2);letter-spacing:.1em}
.cc .code{margin-top:10px;font-size:32px;font-weight:800;letter-spacing:.22em;
  background:linear-gradient(96deg,var(--tx1),var(--ac1) 60%,var(--ac2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.cc .pin{margin-top:6px;font-size:12.5px;color:var(--tx2)}
.cc .pin b{color:var(--tx1);letter-spacing:.15em}
.cc .acts{margin-top:14px;display:flex;gap:8px}
.cc .acts button{font-size:12px;font-weight:800;padding:8px 14px;border-radius:99px;border:1px solid var(--line2);color:var(--tx2)}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .ic{width:36px;height:36px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:15px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.mrow b{font-size:13.5px;display:block;letter-spacing:.08em}
.mrow small{font-size:11.5px;color:var(--tx3)}
.mrow .pl{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--ac3);border:1px solid color-mix(in srgb,var(--ac3) 40%,transparent);border-radius:99px;padding:3px 9px}
.toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(16px);z-index:90;
  background:rgba(14,17,25,.92);border:1px solid var(--line);border-radius:999px;padding:10px 18px;
  font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s,transform .3s var(--spring)}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<div class="gate" id="gate">
  <a class="g-back" href="index.html">← 앱으로</a>
  <div class="g-card">
    <div class="g-mark">🛠</div>
    <div class="g-tt">관리자</div>
    <div class="g-sub">관리자 아이디와 비밀번호로</div>
    <input id="g-id" placeholder="아이디" autocomplete="off">
    <input id="g-pin" placeholder="비밀번호" type="password" autocomplete="off">
    <div class="g-err" id="g-err"></div>
    <button class="g-btn" id="g-go">들어가기</button>
  </div>
</div>

<header class="tb" style="display:none" id="tb">
  <b>🛠 관리자 · 컨텐츠의 모든것</b>
  <a href="index.html">← 앱으로</a>
</header>

<main class="wrap" style="display:none" id="main">
  <div class="card">
    <h2>🎫 코드 발급</h2>
    <div class="frow">
      <input id="nm" placeholder="누구에게? (메모)" autocomplete="off">
      <button class="gen" id="gen">발급</button>
    </div>
    <div class="cc" id="cc">
      <div class="br">컨텐츠의 모든것 · 이용 코드</div>
      <div class="code" id="cc-code">—</div>
      <div class="pin">임시 비밀번호 <b id="cc-pin">—</b> · 첫 로그인에서 바꾸게 됩니다</div>
      <div class="acts"><button id="cc-copy">⧉ 복사</button></div>
    </div>
    <div class="hint">지금은 로컬(데모) 발급입니다 — Supabase SQL을 RUN 하면 이 버튼이 실서버 발급으로 바뀝니다.</div>
  </div>

  <div class="card">
    <h2>👥 발급된 코드</h2>
    <div id="mlist"></div>
    <div class="hint" id="mhint">아직 발급한 코드가 없습니다 — 위에서 첫 코드를 만들어 보세요.</div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const CFG = { key:'cme', adminId:'qkdna12', adminTempPin:'2222' };
const $=s=>document.querySelector(s);
const K=k=>CFG.key+'-'+k;
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}
async function sha256(str){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
/* 한글→영문 키 자동 변환 (아이디칸) */
const H2Q=(function(){
  const CHO='r,R,s,e,E,f,a,q,Q,t,T,d,w,W,c,z,x,v,g'.split(',');
  const JUNG='k,o,i,O,j,p,u,P,h,hk,ho,hl,y,n,nj,np,nl,b,m,ml,l'.split(',');
  const JONG=',r,R,rt,s,sw,sg,e,f,fr,fa,fq,ft,fx,fv,fg,a,q,qt,t,T,d,w,c,z,x,v,g'.split(',');
  const JAMO={'ㄱ':'r','ㄲ':'R','ㄳ':'rt','ㄴ':'s','ㄵ':'sw','ㄶ':'sg','ㄷ':'e','ㄸ':'E','ㄹ':'f','ㄺ':'fr','ㄻ':'fa','ㄼ':'fq','ㄽ':'ft','ㄾ':'fx','ㄿ':'fv','ㅀ':'fg','ㅁ':'a','ㅂ':'q','ㅃ':'Q','ㅄ':'qt','ㅅ':'t','ㅆ':'T','ㅇ':'d','ㅈ':'w','ㅉ':'W','ㅊ':'c','ㅋ':'z','ㅌ':'x','ㅍ':'v','ㅎ':'g','ㅏ':'k','ㅐ':'o','ㅑ':'i','ㅒ':'O','ㅓ':'j','ㅔ':'p','ㅕ':'u','ㅖ':'P','ㅗ':'h','ㅘ':'hk','ㅙ':'ho','ㅚ':'hl','ㅛ':'y','ㅜ':'n','ㅝ':'nj','ㅞ':'np','ㅟ':'nl','ㅠ':'b','ㅡ':'m','ㅢ':'ml','ㅣ':'l'};
  return function(str){ let out='';
    for(const ch of str){ const c=ch.charCodeAt(0);
      if(c>=0xAC00&&c<=0xD7A3){ const n=c-0xAC00;
        out+=CHO[Math.floor(n/588)]+JUNG[Math.floor((n%588)/28)]+JONG[n%28]; }
      else if(JAMO[ch]) out+=JAMO[ch];
      else out+=ch; }
    return out; };
})();
(function(){ const el=$('#g-id');
  /* 🚨 한글 조합 중에 value를 건드리면 IME가 깨져 글자가 씹힌다 — 조합이 끝난 뒤에만 */
  function conv(){
    const v=H2Q(el.value); if(v===el.value) return;
    const atEnd = el.selectionStart === el.value.length;
    el.value = v;
    try{ const c = atEnd ? v.length : el.selectionStart; el.setSelectionRange(c, c); }catch(_){}
  }
  el.addEventListener('input', e=>{ if(e.isComposing) return; conv(); });
  el.addEventListener('compositionend', conv);
})();

/* 게이트 — index와 같은 저장키(cme-adminpin)를 본다 */
async function gateGo(){
  const id=$('#g-id').value.trim(), pin=$('#g-pin').value, err=$('#g-err');
  err.textContent='';
  if(id.toUpperCase()!==CFG.adminId.toUpperCase()){ err.textContent='아이디 또는 비밀번호가 달라요'; return; }
  const saved=localStorage.getItem(K('adminpin'));
  let ok=false;
  if(!saved) ok = (pin===CFG.adminTempPin);
  else ok = (await sha256(pin))===saved;
  if(!ok){ err.textContent='아이디 또는 비밀번호가 달라요'; return; }
  if(!saved){ toast('임시 비밀번호입니다 — 앱에서 로그인하면 바꾸기가 뜹니다'); }
  $('#gate').style.display='none';
  $('#tb').style.display='flex';
  $('#main').style.display='block';
  renderList();
}
$('#g-go').addEventListener('click',gateGo);
['g-id','g-pin'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')gateGo()}));

/* 코드 발급 (로컬 데모 — 실서버 전환 시 cme_admin_issue RPC로 교체) */
function members(){ try{return JSON.parse(localStorage.getItem(K('members'))||'[]')}catch(e){return[]} }
function saveMembers(a){ localStorage.setItem(K('members'),JSON.stringify(a)) }
function randCode(){ const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s='';
  const u=new Uint32Array(6); crypto.getRandomValues(u);
  for(let i=0;i<6;i++) s+=A[u[i]%A.length]; return s; }
let lastCode='',lastPin='';
$('#gen').addEventListener('click',()=>{
  const nm=$('#nm').value.trim()||'이름 없음';
  lastCode=randCode(); lastPin='2222';
  const list=members(); list.unshift({code:lastCode,nm,at:Date.now(),plan:'회원'});
  saveMembers(list);
  $('#cc-code').textContent=lastCode; $('#cc-pin').textContent=lastPin;
  $('#cc').style.display='block';
  renderList(); toast('코드를 발급했습니다');
});
$('#cc-copy').addEventListener('click',async()=>{
  try{ await navigator.clipboard.writeText('컨텐츠의 모든것 코드: '+lastCode+' · 임시 비밀번호: '+lastPin);
    toast('복사했습니다'); }catch(e){ toast('복사가 막혔습니다'); }
});
function renderList(){
  const list=members(), box=$('#mlist');
  $('#mhint').style.display=list.length?'none':'block';
  box.innerHTML=list.map(m=>
    '<div class="mrow"><span class="ic">🎫</span><div><b>'+m.code+'</b><small>'+m.nm+' · '
    +new Date(m.at).toLocaleDateString('ko-KR')+'</small></div><span class="pl">'+m.plan+'</span></div>').join('');
}
</script>
</body>
</html>
