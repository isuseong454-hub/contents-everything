<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>분해봇 — 새판 5안</title>
<style>
:root{
  --hook:#B9A9F6; --story:#8EC7F6; --conv:#6FE0C8; --prod:#C8F169;
  --tx1:#EDF0F6; --tx2:#8B93A3; --tx3:#5A6272;
  --glass:rgba(255,255,255,.035); --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.15);
  --yt:#E0574B; --ig:#D62976;
  --ease:cubic-bezier(.22,.61,.36,1);
  --sp-flat:cubic-bezier(.32,.72,0,1);
  --sp-bounce:cubic-bezier(.32,1.34,.42,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--tx1);font:100%/1.5 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(120% 70% at 50% 0%, #0d1017, #070910 54%, #050609);min-height:100vh;padding:20px 16px 80px}
.wrap{max-width:1240px;margin:0 auto}
h1{font-size:clamp(20px,3vw,24px);line-height:1.1;letter-spacing:-.02em;margin:0 0 6px}
.lead{color:var(--tx2);font-size:12.5px;line-height:1.65;margin:0 0 6px;max-width:76ch;text-wrap:pretty}
.lead b{color:var(--prod)}
.intent{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.intent s{text-decoration:none;font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:8px;
  background:rgba(200,241,105,.07);border:1px solid rgba(200,241,105,.22);color:var(--prod)}
.allbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.allbar button{font-family:inherit;font-size:12.5px;font-weight:800;padding:10px 16px;border-radius:11px;cursor:pointer;
  background:var(--prod);border:none;color:#06080c;transition:transform .1s ease-out}
.allbar button:active{transform:scale(.97)}
.allbar button.ghost{background:var(--glass);border:1px solid var(--line2);color:var(--tx2)}
.allbar s{text-decoration:none;font-size:11px;color:var(--tx3)}

.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:760px){ .grid{grid-template-columns:repeat(2,1fr)} }
@media(min-width:1180px){ .grid{grid-template-columns:repeat(3,1fr)} }
.card{border:1px solid var(--line);border-radius:20px;overflow:hidden;position:relative;
  background:linear-gradient(180deg,rgba(255,255,255,.022),transparent 40%)}
.chd{padding:13px 15px;border-bottom:1px solid var(--line)}
.chd b{font-size:13px;font-weight:800;display:block;letter-spacing:-.01em}
.chd s{text-decoration:none;font-size:10.5px;color:var(--tx3);line-height:1.5;display:block;margin-top:3px}
.ctl{display:flex;gap:5px;padding:11px 15px 0}
.ctl button{flex:1;font-family:inherit;font-size:11px;font-weight:800;padding:7px 0;border-radius:9px;cursor:pointer;
  background:var(--glass);border:1px solid var(--line);color:var(--tx2);transition:transform .1s ease-out}
.ctl button:active{transform:scale(.96)}
.ctl button.yt{color:#FF7A6E;border-color:rgba(224,87,75,.36)}
.ctl button.ig{color:#F06FB8;border-color:rgba(214,41,118,.36)}
.ctl button[disabled]{opacity:.4;cursor:default}
.scene{position:relative;height:268px;margin:8px 0 0}
.scene svg{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
.state{text-align:center;font-size:10.5px;font-weight:700;color:var(--tx3);padding:2px 12px 0;min-height:16px;transition:color .3s}
.card.run .state{color:var(--story)} .card.done .state{color:var(--prod)}
.out{padding:0 15px 15px;min-height:92px}
.outcard{display:flex;gap:10px;align-items:center;padding:9px;border-radius:13px;
  background:rgba(200,241,105,.06);border:1px solid rgba(200,241,105,.26);
  animation:spit .5s var(--sp-bounce) 1 both}
@keyframes spit{ from{opacity:0;transform:translateY(-14px) scale(.92)} to{opacity:1;transform:none} }
.outcard i{width:32px;height:44px;border-radius:8px;flex:none;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.outcard .tt b{display:block;font-size:11.5px;font-weight:800;line-height:1.35}
.outcard .tt s{display:block;text-decoration:none;font-size:9.5px;color:var(--prod);margin-top:3px;font-weight:700}
.outempty{font-size:10.5px;color:var(--tx3);text-align:center;padding:28px 10px;line-height:1.6;
  border:1px dashed var(--line);border-radius:13px}

/* 입구 — 두 갈래는 «가는 길이 다르다» */
.plabel{font:800 9px/1 -apple-system,system-ui;fill:var(--tx3)}
.card.run .port.on .plabel{fill:var(--tx1)}
.card.run .port.on .pbg{filter:brightness(1.22)}
.pbg{transition:filter .35s var(--ease)}
.port{opacity:.42;transition:opacity .35s var(--ease)}
.card.run .port.on,.card.done .port.on{opacity:1}
.feed{stroke-width:2.6;fill:none;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);opacity:0}
.card.run .feed.on{opacity:1;animation:draw 1s var(--ease) 1 forwards}
.card.done .feed.on{opacity:.45;stroke-dashoffset:0}
@keyframes draw{ to{stroke-dashoffset:0} }

/* ══ ① 파형 → 글자 ══ */
#W .wv{stroke:var(--ig);stroke-width:2.2;fill:none;stroke-linecap:round;opacity:0}
.card.run #W.ig .wv{opacity:1;animation:wvin 1.6s var(--ease) 1 both}
@keyframes wvin{ 0%{opacity:0;transform:translateX(-30px)} 30%{opacity:1} 100%{opacity:1;transform:translateX(0)} }
#W .ytonly{opacity:0}
.card.run #W.yt .ytonly,.card.done #W.yt .ytonly{opacity:1;animation:gl .5s var(--sp-flat) 1 both}
#W .wvlabel{opacity:0}
.card.run #W.ig .wvlabel,.card.done #W.ig .wvlabel{opacity:1}
#W .glyph{opacity:0}
.card.run #W .glyph{animation:gl .6s var(--sp-flat) 1 both}
.card.done #W .glyph{opacity:1}
@keyframes gl{ from{opacity:0;transform:scaleY(.2)} to{opacity:1;transform:scaleY(1)} }
#W .g2{animation-delay:.12s} #W .g3{animation-delay:.24s} #W .g4{animation-delay:.36s}
#W .deskline{stroke:rgba(255,255,255,.3);stroke-width:2;transition:stroke .4s}
.card.run #W .deskline{stroke:rgba(142,199,246,.5)}
.card.done #W .deskline{stroke:rgba(200,241,105,.5)}
#W .seg{opacity:0}
.card.done #W .seg{animation:segin .5s var(--sp-bounce) 1 both}
@keyframes segin{ from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:none} }

/* ══ ② 엑스레이 투시 ══ */
#X .plate{fill:rgba(255,255,255,.05);stroke:rgba(255,255,255,.26);stroke-width:1.6;transition:.45s var(--ease)}
.card.run #X .plate{stroke:rgba(142,199,246,.42)}
.card.done #X .plate{stroke:rgba(200,241,105,.44);fill:rgba(200,241,105,.045)}
#X .beam{opacity:0}
.card.run #X .beam{opacity:1;animation:scan 2s var(--ease) 1 both}
@keyframes scan{ 0%{transform:translateY(-52px)} 100%{transform:translateY(56px)} }
#X .bone{opacity:0;transition:opacity .4s}
.card.run #X .bone{animation:bone .5s var(--ease) 1 both}
.card.done #X .bone{opacity:1}
@keyframes bone{ from{opacity:0} to{opacity:1} }
#X .b2{animation-delay:.34s} #X .b3{animation-delay:.68s} #X .b4{animation-delay:1s} #X .b5{animation-delay:1.3s}

/* ══ ③ 분해대 — 완성품이 부품으로 ══ */
#B .whole{transition:opacity .4s var(--ease)}
.card.run #B .whole,.card.done #B .whole{opacity:0}
#B .part{opacity:0}
.card.run #B .part{animation:part 1.2s var(--sp-flat) 1 both}
.card.done #B .part{opacity:1;transform:translate(var(--tx),var(--ty))}
@keyframes part{ from{opacity:0;transform:translate(0,0)} to{opacity:1;transform:translate(var(--tx),var(--ty))} }
#B .p2{animation-delay:.1s} #B .p3{animation-delay:.2s}
#B .p4{animation-delay:.3s} #B .p5{animation-delay:.4s} #B .p6{animation-delay:.5s}
#B .cross{stroke:rgba(255,255,255,.24);stroke-width:1.4;stroke-dasharray:4 5}

/* ══ ④ 제련로 ══ */
#M .furn{fill:rgba(255,255,255,.05);stroke:rgba(255,255,255,.28);stroke-width:1.7;transition:.5s var(--ease)}
.card.run #M .furn{stroke:rgba(240,140,60,.55)}
.card.done #M .furn{stroke:rgba(200,241,105,.5)}
#M .melt{transform-origin:center bottom;transform:scaleY(0);opacity:0}
.card.run #M .melt{opacity:1;animation:melt 2.2s var(--ease) 1 forwards}
@keyframes melt{ to{transform:scaleY(1)} }
.card.done #M .melt{opacity:1;transform:scaleY(1)}
#M .ore{opacity:0}
.card.run #M .ore{animation:orein .9s var(--sp-flat) 1 both}
@keyframes orein{ 0%{opacity:1;transform:translateY(-36px)} 80%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(4px)} }
#M .bar{opacity:0}
.card.done #M .bar{animation:barout .55s var(--sp-bounce) 1 both}
@keyframes barout{ from{opacity:0;transform:translateY(-12px) scaleX(.7)} to{opacity:1;transform:none} }

/* ══ ⑤ 현상소 ══ */
#F .strip{transition:transform 2s var(--ease)}
.card.run #F .strip{animation:dip 2.4s var(--ease) 1 both}
@keyframes dip{ 0%{transform:translateY(-30px)} 100%{transform:translateY(26px)} }
.card.done #F .strip{transform:translateY(26px)}
#F .bath{fill:rgba(224,87,75,.1);stroke:rgba(224,87,75,.45);stroke-width:1.6;transition:.5s var(--ease)}
.card.run #F .bath{fill:rgba(224,87,75,.13);stroke:rgba(224,87,75,.5)}
.card.done #F .bath{fill:rgba(200,241,105,.09);stroke:rgba(200,241,105,.42)}
#F .frameimg{opacity:0;transition:opacity .5s}
.card.run #F .frameimg{animation:emerge 1.1s var(--ease) 1 both}
.card.done #F .frameimg{opacity:1}
@keyframes emerge{ from{opacity:0} to{opacity:.9} }
#F .fi2{animation-delay:.3s} #F .fi3{animation-delay:.6s}
#F .lamp{fill:#3a2226;transition:fill .4s}
.card.run #F .lamp{fill:var(--yt)} .card.done #F .lamp{fill:var(--prod)}
#F .print{opacity:0}
.card.done #F .print{animation:segin .55s var(--sp-bounce) 1 both}

@media(prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;transition-duration:.01ms!important} }
</style>
</head>
<body>
<div class="wrap">
  <h1>분해봇 — 새판 5안</h1>
  <p class="lead">로봇 캐릭터를 지우고 <b>은유부터 새로 짰습니다.</b> 붙잡은 건 사장님 의도 넷뿐입니다.</p>
  <div class="intent">
    <s>① 두 갈래 입구가 «다르게» 보인다</s><s>② 꺼짐 → 일함 → 뱉음</s>
    <s>③ 어디서 왔는지 보인다</s><s>④ 재밌다</s>
  </div>

  <div class="allbar">
    <button data-all="ig">◉ 인스타 넣기 — 전부</button>
    <button data-all="yt">▶ 유튜브 넣기 — 전부</button>
    <button class="ghost" data-reset="1">처음으로</button>
    <s>유튜브는 이미 «글자»라 짧고, 인스타는 «소리»부터라 길다 — 그 차이를 그렸습니다</s>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
var ANS = [
  {id:'W', nm:'① 받아쓰기 대 — 파형이 글자가 된다',
   sub:'인스타는 «소리»가 흘러와 글자로 굳고, 유튜브는 이미 «글자»로 온다. 실제 공정 그대로'},
  {id:'X', nm:'② 투시대 — 뼈대가 드러난다',
   sub:'영상을 눕히고 빛으로 훑는다. 지나간 자리에 구성 뼈대가 하나씩 떠오른다'},
  {id:'B', nm:'③ 분해대 — 통째가 조각으로',
   sub:'«분해»의 문자 그대로. 한 덩어리가 여섯 조각으로 갈라져 제자리를 찾는다'},
  {id:'M', nm:'④ 제련로 — 녹여서 금을 남긴다',
   sub:'원석이 떨어지고 쇳물이 차오른다. 불순물은 날아가고 «훔칠 것»만 금괴로'},
  {id:'F', nm:'⑤ 현상소 — 어둠 속에서 떠오른다',
   sub:'필름이 현상액에 잠기고 붉은 등 아래서 상이 맺힌다. 마르면 한 장이 걸린다'}
];
var OUT = {
  yt:{g:'linear-gradient(150deg,#3a2f12,#1d1707)', t:'3초 안에 안 넘기게 하는 법', s:'원고 217자 · 구성 6칸'},
  ig:{g:'linear-gradient(150deg,#331a2e,#1a0d17)', t:'브이로그인데 왜 이건 터졌을까', s:'받아쓰기 412자 · 구성 5칸'}
};
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var DEFS='<defs><linearGradient id="ig'+Math.random().toString(36).slice(2,7)+'" x1="0" y1="1" x2="1" y2="0"></linearGradient></defs>';

function port(x,y,kind,r){
  r=r||15;
  var col = kind==='yt' ? '#E0574B' : 'url(#IGG)';
  var ico = kind==='yt'
    ? '<path d="M-3 -4.2v8.4l6.9-4.2z" fill="#fff"/>'
    : '<g fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round">'+
      '<rect x="-6.1" y="-6.1" width="12.2" height="12.2" rx="3.9"/><circle r="2.8"/></g>'+
      '<circle cx="4.1" cy="-4.1" r="1" fill="#fff"/>';
  return '<g class="port '+kind+'" transform="translate('+x+','+y+')">'+
    '<rect class="pbg" x="'+(-r)+'" y="'+(-r)+'" width="'+(r*2)+'" height="'+(r*2)+'" rx="'+(r*.62)+'" fill="'+col+'"/>'+
    ico+'<text class="plabel" y="'+(r+13)+'" text-anchor="middle">'+(kind==='yt'?'유튜브':'인스타')+'</text></g>';
}
var IGDEF='<defs><linearGradient id="IGG" x1="0" y1="1" x2="1" y2="0">'+
  '<stop offset="0" stop-color="#FEDA75"/><stop offset=".22" stop-color="#FA7E1E"/>'+
  '<stop offset=".52" stop-color="#D62976"/><stop offset=".76" stop-color="#962FBF"/>'+
  '<stop offset="1" stop-color="#4F5BD5"/></linearGradient></defs>';

/* ① 받아쓰기 대 */
function sW(){ return '<svg viewBox="0 0 300 268" id="W">'+IGDEF+
  port(66,36,'yt')+port(234,36,'ig')+
  '<path class="feed yt" style="--len:120" stroke="#E0574B" d="M66 54 V88 Q66 102 84 102 H132"/>'+
  '<path class="feed ig" style="--len:120" stroke="#D62976" d="M234 54 V88 Q234 102 216 102 H168"/>'+
  /* 왼쪽에서 오는 것 = 이미 «글자» */
  '<g class="ytonly"><rect x="106" y="96" width="9" height="12" rx="2" fill="rgba(224,87,75,.6)"/>'+
  '<rect x="118" y="96" width="9" height="12" rx="2" fill="rgba(224,87,75,.42)"/>'+
  '<text x="116" y="88" text-anchor="middle" font-size="8" font-weight="800" fill="rgba(224,87,75,.8)">이미 글자</text></g>'+
  /* 오른쪽에서 오는 것 = «소리» */
  '<path class="wv" d="M176 102 q6-11 12 0 t12 0 t12 0 t12 0"/>'+
  '<text class="wvlabel" x="200" y="88" text-anchor="middle" font-size="8" font-weight="800" fill="rgba(214,41,118,.85)">소리부터</text>'+
  /* 변환대 */
  '<rect x="52" y="120" width="196" height="46" rx="12" fill="rgba(255,255,255,.035)" stroke="rgba(255,255,255,.16)" stroke-width="1.4"/>'+
  '<line class="deskline" x1="66" y1="140" x2="234" y2="140"/>'+
  '<text x="150" y="134" text-anchor="middle" font-size="9.5" font-weight="800" fill="var(--tx2)">받아쓰기 대</text>'+
  /* 글자로 굳는다 */
  '<g class="glyph g2"><rect x="76" y="150" width="30" height="9" rx="3" fill="rgba(142,199,246,.55)"/></g>'+
  '<g class="glyph g3"><rect x="112" y="150" width="46" height="9" rx="3" fill="rgba(142,199,246,.44)"/></g>'+
  '<g class="glyph g4"><rect x="164" y="150" width="34" height="9" rx="3" fill="rgba(142,199,246,.32)"/></g>'+
  /* 구성 6칸 */
  '<g class="seg">'+[0,1,2,3,4,5].map(function(i){
    var w=30, x=150-((w+5)*6-5)/2 + i*(w+5);
    return '<rect x="'+x+'" y="188" width="'+w+'" height="14" rx="4" fill="rgba(200,241,105,.13)" stroke="rgba(200,241,105,.42)" stroke-width="1.1"/>';
  }).join('')+'<text x="150" y="222" text-anchor="middle" font-size="9" font-weight="800" fill="var(--prod)">구성 6칸</text></g>'+
  '</svg>'; }

/* ② 투시대 */
function sX(){ return '<svg viewBox="0 0 300 268" id="X">'+IGDEF+
  port(66,34,'yt')+port(234,34,'ig')+
  '<path class="feed yt" style="--len:110" stroke="#E0574B" d="M66 52 V80 Q66 94 84 94 H124"/>'+
  '<path class="feed ig" style="--len:110" stroke="#D62976" d="M234 52 V80 Q234 94 216 94 H176"/>'+
  /* 눕힌 영상 */
  '<rect class="plate" x="84" y="106" width="132" height="106" rx="14"/>'+
  '<text x="150" y="100" text-anchor="middle" font-size="9.5" font-weight="800" fill="var(--tx2)">투시대</text>'+
  '<g opacity=".5"><line x1="98" y1="118" x2="164" y2="118" stroke="rgba(255,255,255,.14)" stroke-width="9" stroke-linecap="round"/>'+
  '<line x1="98" y1="134" x2="188" y2="134" stroke="rgba(255,255,255,.1)" stroke-width="9" stroke-linecap="round"/>'+
  '<line x1="98" y1="150" x2="152" y2="150" stroke="rgba(255,255,255,.08)" stroke-width="9" stroke-linecap="round"/>'+
  '<line x1="98" y1="166" x2="176" y2="166" stroke="rgba(255,255,255,.07)" stroke-width="9" stroke-linecap="round"/>'+
  '<line x1="98" y1="182" x2="140" y2="182" stroke="rgba(255,255,255,.06)" stroke-width="9" stroke-linecap="round"/></g>'+
  /* 뼈대 */
  '<g class="bone b1"><rect x="98" y="118" width="66" height="9" rx="4" fill="rgba(226,92,92,.5)"/></g>'+
  '<g class="bone b2"><rect x="98" y="134" width="90" height="9" rx="4" fill="rgba(91,141,239,.5)"/></g>'+
  '<g class="bone b3"><rect x="98" y="150" width="54" height="9" rx="4" fill="rgba(216,178,58,.5)"/></g>'+
  '<g class="bone b4"><rect x="98" y="166" width="78" height="9" rx="4" fill="rgba(169,196,55,.5)"/></g>'+
  '<g class="bone b5"><rect x="98" y="182" width="42" height="9" rx="4" fill="rgba(47,208,123,.5)"/></g>'+
  /* 스캔 광선 */
  '<g class="beam"><rect x="84" y="152" width="132" height="3" fill="rgba(142,199,246,.85)"/>'+
  '<rect x="84" y="140" width="132" height="27" fill="rgba(142,199,246,.13)"/></g>'+
  '</svg>'; }

/* ③ 분해대 */
function sB(){
  var P=[[-52,-30],[0,-30],[52,-30],[-52,14],[0,14],[52,14]];
  return '<svg viewBox="0 0 300 268" id="B">'+IGDEF+
  port(66,34,'yt')+port(234,34,'ig')+
  '<path class="feed yt" style="--len:110" stroke="#E0574B" d="M66 52 V82 Q66 96 84 96 H132"/>'+
  '<path class="feed ig" style="--len:110" stroke="#D62976" d="M234 52 V82 Q234 96 216 96 H168"/>'+
  '<line class="cross" x1="46" y1="118" x2="254" y2="118"/>'+
  '<text x="150" y="112" text-anchor="middle" font-size="9.5" font-weight="800" fill="var(--tx2)">분해대</text>'+
  '<g transform="translate(150,172)">'+
    '<rect class="whole" x="-34" y="-34" width="68" height="68" rx="14" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.2)" stroke-width="1.5"/>'+
    P.map(function(p,i){
      return '<rect class="part p'+(i+1)+'" style="--tx:'+p[0]+'px;--ty:'+p[1]+'px" x="-19" y="-11" width="38" height="22" rx="6" '+
        'fill="rgba(200,241,105,.12)" stroke="rgba(200,241,105,.42)" stroke-width="1.2"/>';
    }).join('')+
  '</g></svg>'; }

  port(66,32,'yt')+port(234,32,'ig')+
  '<path class="feed yt" style="--len:110" stroke="#E0574B" d="M66 50 V78 Q66 92 84 92 H140"/>'+
  '<path class="feed ig" style="--len:110" stroke="#D62976" d="M234 50 V78 Q234 92 216 92 H160"/>'+
  '<g transform="translate(150,110)"><g class="ore"><polygon points="0,-12 11,-4 7,10 -7,10 -11,-4" fill="rgba(255,255,255,.16)" stroke="rgba(255,255,255,.3)" stroke-width="1.2"/></g></g>'+
  /* 노 */
  '<path class="furn" d="M104 124 h92 l-13 74 h-66 z"/>'+

/* ⑤ 현상소 */
function sF(){ return '<svg viewBox="0 0 300 268" id="F">'+IGDEF+
  port(64,32,'yt')+port(236,32,'ig')+
  '<path class="feed yt" style="--len:106" stroke="#E0574B" d="M64 50 V76 Q64 90 82 90 H136"/>'+
  '<path class="feed ig" style="--len:106" stroke="#D62976" d="M236 50 V76 Q236 90 218 90 H164"/>'+

    [0,1,2,3,4,5].map(function(i){
      return '<rect x="120" y="'+(100+i*15)+'" width="4" height="6" rx="1" fill="rgba(255,255,255,.16)"/>'+
             '<rect x="176" y="'+(100+i*15)+'" width="4" height="6" rx="1" fill="rgba(255,255,255,.16)"/>';

    '<text y="4" text-anchor="middle" font-size="8.5" font-weight="800" fill="var(--prod)">한 장 인화</text>'+

var SCENES={W:sW,X:sX,B:sB,M:sM,F:sF};
document.getElementById('grid').innerHTML = ANS.map(function(a){
  return '<section class="card" data-an="'+a.id+'">'+
    '<div class="chd"><b>'+a.nm+'</b><s>'+a.sub+'</s></div>'+
    '<div class="ctl"><button class="yt" data-run="'+a.id+'|yt">▶ 유튜브</button>'+
    '<button class="ig" data-run="'+a.id+'|ig">◉ 인스타</button></div>'+
    '<div class="scene">'+SCENES[a.id]()+'</div>'+
    '<p class="state">꺼져 있음</p>'+
    '<div class="out"><div class="outempty">여기로 결과가 나옵니다</div></div>'+
    '</section>';
}).join('');

var T={};
function reset(id){
  var c=document.querySelector('[data-an="'+id+'"]'); if(!c) return;
  clearTimeout(T[id]); clearTimeout(T[id+'b']);
  c.classList.remove('run','done');
  c.querySelector('.scene svg').classList.remove('yt','ig');
  c.querySelectorAll('.feed').forEach(function(f){ f.classList.remove('on'); });
  c.querySelectorAll('.port').forEach(function(p){ p.classList.remove('on'); });
  c.querySelector('.state').textContent='꺼져 있음';
  c.querySelector('.out').innerHTML='<div class="outempty">여기로 결과가 나옵니다</div>';
  c.querySelectorAll('.ctl button').forEach(function(b){ b.disabled=false; });
}
function run(id, kind){
  var c=document.querySelector('[data-an="'+id+'"]'); if(!c) return;
  reset(id);
  var ig = kind==='ig', dur = ig ? 4200 : 2600;
  c.querySelectorAll('.ctl button').forEach(function(b){ b.disabled=true; });
  c.querySelector('.scene svg').classList.add(kind);
  c.querySelector('.port.'+kind).classList.add('on');
  c.querySelector('.feed.'+kind).classList.add('on');
  void c.offsetWidth;
  c.classList.add('run');
  c.querySelector('.state').textContent = ig ? '소리부터 글자로…' : '자막을 읽는 중…';
  T[id]=setTimeout(function(){ c.querySelector('.state').textContent='구성으로 뜯는 중…'; }, Math.round(dur*.55));
  T[id+'b']=setTimeout(function(){
    c.classList.remove('run'); c.classList.add('done');
    c.querySelector('.state').textContent='끝났습니다';
    var o=OUT[kind];
    c.querySelector('.out').innerHTML='<div class="outcard"><i style="background:'+o.g+'"></i>'+
      '<div class="tt"><b>'+esc(o.t)+'</b><s>'+esc(o.s)+'</s></div></div>';
    c.querySelectorAll('.ctl button').forEach(function(b){ b.disabled=false; });
  }, dur);
}
document.addEventListener('click', function(e){
  var r=e.target.closest('[data-run]');
  if(r){ var p=r.dataset.run.split('|'); run(p[0],p[1]); return; }
  var a=e.target.closest('[data-all]');
  if(a){ ANS.forEach(function(x){ run(x.id, a.dataset.all); }); return; }
  if(e.target.closest('[data-reset]')){ ANS.forEach(function(x){ reset(x.id); }); return; }
});
</script>
