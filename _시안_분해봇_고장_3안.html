<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>분해봇 — 고장난 로봇 3안</title>
<style>
:root{
  --hook:#B9A9F6; --story:#8EC7F6; --conv:#6FE0C8; --prod:#C8F169;
  --tx1:#EDF0F6; --tx2:#8B93A3; --tx3:#5A6272;
  --glass:rgba(255,255,255,.035); --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.15);
  --yt:#E0574B; --ig:#D62976; --rust:#C98A5B;
  --ease:cubic-bezier(.22,.61,.36,1);
  --sp-flat:cubic-bezier(.32,.72,0,1);
  --sp-bounce:cubic-bezier(.32,1.34,.42,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--tx1);font:100%/1.5 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(120% 70% at 50% 0%, #0d1017, #070910 54%, #050609);min-height:100vh;padding:20px 16px 80px}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:clamp(20px,3vw,24px);line-height:1.1;letter-spacing:-.02em;margin:0 0 6px}
.lead{color:var(--tx2);font-size:12.5px;line-height:1.65;margin:0 0 16px;max-width:76ch;text-wrap:pretty}
.lead b{color:var(--prod)}
.allbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.allbar button{font-family:inherit;font-size:12.5px;font-weight:800;padding:10px 16px;border-radius:11px;cursor:pointer;
  background:var(--prod);border:none;color:#06080c;transition:transform .1s ease-out}
.allbar button:active{transform:scale(.97)}
.allbar button.ghost{background:var(--glass);border:1px solid var(--line2);color:var(--tx2)}
.allbar s{text-decoration:none;font-size:11px;color:var(--tx3)}

.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:820px){ .grid{grid-template-columns:repeat(3,1fr)} }
.card{border:1px solid var(--line);border-radius:20px;overflow:hidden;position:relative;
  background:linear-gradient(180deg,rgba(255,255,255,.022),transparent 40%)}
.chd{padding:13px 15px;border-bottom:1px solid var(--line)}
.chd b{font-size:13px;font-weight:800;display:block;letter-spacing:-.01em}
.chd s{text-decoration:none;font-size:10.5px;color:var(--tx3);line-height:1.5;display:block;margin-top:3px}
.ctl{display:flex;gap:5px;padding:11px 15px 0}
.ctl button{flex:1;font-family:inherit;font-size:11px;font-weight:800;padding:7px 0;border-radius:9px;cursor:pointer;
  background:var(--glass);border:1px solid var(--line);color:var(--tx2);transition:transform .1s ease-out}
.ctl button:active{transform:scale(.96)}
.ctl button.yt{color:#FF7A6E;border-color:rgba(224,87,75,.36)}
.ctl button.ig{color:#F06FB8;border-color:rgba(214,41,118,.36)}
.ctl button[disabled]{opacity:.4;cursor:default}
.scene{position:relative;height:296px;margin:8px 0 0}
.scene svg{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
.state{text-align:center;font-size:10.5px;font-weight:700;color:var(--tx3);padding:2px 12px 0;min-height:16px;transition:color .3s}
.card.run .state{color:var(--rust)} .card.done .state{color:var(--prod)}
.out{padding:0 15px 15px;min-height:92px}
.outcard{display:flex;gap:10px;align-items:center;padding:9px;border-radius:13px;
  background:rgba(200,241,105,.06);border:1px solid rgba(200,241,105,.26);
  animation:spitw .6s var(--sp-bounce) 1 both}
/* 결과물도 «비뚤게» 튀어나온다 — 멀쩡히 나오면 고장난 게 아니다 */
@keyframes spitw{ 0%{opacity:0;transform:translateY(-16px) rotate(-6deg)} 60%{transform:translateY(2px) rotate(2.5deg)} 100%{opacity:1;transform:none} }
.outcard i{width:32px;height:44px;border-radius:8px;flex:none;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.outcard .tt b{display:block;font-size:11.5px;font-weight:800;line-height:1.35}
.outcard .tt s{display:block;text-decoration:none;font-size:9.5px;color:var(--prod);margin-top:3px;font-weight:700}
.outempty{font-size:10.5px;color:var(--tx3);text-align:center;padding:28px 10px;line-height:1.6;
  border:1px dashed var(--line);border-radius:13px}

.pipe{stroke:rgba(255,255,255,.11);stroke-width:2.4;fill:none;stroke-linecap:round}
.feed{stroke-width:2.8;fill:none;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);opacity:0}
.card.run .feed.on{opacity:1;animation:draw 1.05s var(--ease) 1 forwards}
.card.done .feed.on{opacity:.5;stroke-dashoffset:0}
@keyframes draw{ to{stroke-dashoffset:0} }
.plabel{font:800 9px/1 -apple-system,system-ui;fill:var(--tx3)}
.port{opacity:.45;transition:opacity .35s var(--ease)}
.card.run .port.on,.card.done .port.on{opacity:1}
.card.run .port.on .plabel{fill:var(--tx1)}

/* ══ 공통 «고장» 어휘 ══
   ① 흔들림은 «불규칙»해야 한다 — 규칙적인 사인파는 «잘 도는 기계»로 보인다
   ② 한 번 털털대다 멈추고, 다시 부르릉 — 실패했다 되살아나는 리듬
   ③ 「달그락」 소리가 글자로 튄다 (만화 문법)
   ④ 눈은 «한쪽만» 깜빡인다 — 대칭이면 멀쩡해 보인다 */
@keyframes rattle{
  0%{transform:rotate(0) translate(0,0)}     7%{transform:rotate(-3.4deg) translate(-1.6px,1px)}
  12%{transform:rotate(2.2deg) translate(1.2px,-.6px)} 19%{transform:rotate(-1.2deg) translate(-.8px,1.4px)}
  26%{transform:rotate(3.8deg) translate(1.8px,.4px)}  33%{transform:rotate(-.6deg) translate(-.4px,-1px)}
  /* 여기서 한 번 «죽는다» */
  40%,52%{transform:rotate(1.4deg) translate(.6px,2px)}
  /* 되살아나 더 크게 */
  60%{transform:rotate(-4.6deg) translate(-2.2px,-1px)} 68%{transform:rotate(3.4deg) translate(2px,1.2px)}
  76%{transform:rotate(-2.6deg) translate(-1.4px,-.6px)} 85%{transform:rotate(1.8deg) translate(1px,.8px)}
  93%{transform:rotate(-.8deg) translate(-.5px,.3px)}   100%{transform:rotate(0) translate(0,0)}
}
.clank{opacity:0;font:900 11px/1 -apple-system,system-ui;fill:var(--rust)}
.card.run .clank{animation:clank 1.1s var(--sp-flat) 3 both}
@keyframes clank{ 0%{opacity:0;transform:translateY(6px) scale(.7)} 22%{opacity:1;transform:translateY(-6px) scale(1.1)}
  55%{opacity:.9;transform:translateY(-10px) scale(1)} 100%{opacity:0;transform:translateY(-18px) scale(.9)} }
.c2{animation-delay:.45s!important} .c3{animation-delay:.95s!important}
.puff{opacity:0}
.card.run .puff{animation:puff 1.3s var(--ease) 2 both}
@keyframes puff{ 0%{opacity:0;transform:translateY(0) scale(.5)} 30%{opacity:.55}
  100%{opacity:0;transform:translateY(-26px) scale(1.5)} }
.p2{animation-delay:.5s!important} .p3{animation-delay:.9s!important}
/* 눈 — 한쪽만, 그것도 깜빡깜빡 */
.eyeL{fill:#2a3040;transition:fill .3s}
.eyeR{fill:#2a3040;transition:fill .3s}
.card.run .eyeL{animation:flick 1.6s steps(1,end) 3 both}
.card.done .eyeL,.card.done .eyeR{fill:var(--prod)}
@keyframes flick{ 0%,18%{fill:#2a3040} 20%,34%{fill:var(--rust)} 36%,52%{fill:#2a3040}
  54%,72%{fill:var(--rust)} 74%,84%{fill:#2a3040} 86%,100%{fill:var(--rust)} }
.card.run .eyeR{animation:flickR 2.4s steps(1,end) 2 both}
@keyframes flickR{ 0%,70%{fill:#2a3040} 72%,100%{fill:var(--rust)} }
.zzz{fill:var(--tx3);font:800 11px/1 system-ui;transition:opacity .3s}
.card.run .zzz,.card.done .zzz{opacity:0}
.sheet{opacity:0}
/* 종이도 비뚤게 튀어나온다 */
.card.done .sheet{animation:sheetw .6s var(--sp-bounce) 1 both}
@keyframes sheetw{ 0%{opacity:0;transform:translateY(-10px) rotate(-9deg)}
  60%{transform:translateY(3px) rotate(4deg)} 100%{opacity:1;transform:none} }
/* 떨어진 볼트 — 평소에도 바닥에 굴러다닌다 */
.bolt{fill:rgba(255,255,255,.22)}
.card.run .boltjump{animation:boltj 1.4s var(--sp-flat) 2 both}
@keyframes boltj{ 0%,100%{transform:translateY(0)} 40%{transform:translateY(-7px) rotate(140deg)} }

/* ══ R1 · 고장난 원본 ══ */
#R1 .rob{transform-origin:0 44px}
.card.run #R1 .rob{animation:rattle 3.4s ease-in-out 1 both}
#R1 .neck{transition:transform .5s var(--sp-bounce)}
.card.done #R1 .neck{transform:rotate(0)}
#R1 .antbent{stroke:rgba(255,255,255,.3);stroke-width:2;fill:none;stroke-linecap:round}

/* ══ R2 · 고물 (녹슨 상자) ══ */
#R2 .rob{transform-origin:0 50px}
.card.run #R2 .rob{animation:rattle 3.8s ease-in-out 1 both}
#R2 .rust{fill:rgba(201,138,91,.16)}
#R2 .lid{transform-origin:-26px -34px;transition:transform .5s var(--sp-flat)}
.card.run #R2 .lid{animation:lid 1.7s var(--sp-flat) 2 both}
@keyframes lid{ 0%,100%{transform:rotate(0)} 45%{transform:rotate(-19deg)} }
#R2 .tread{stroke:rgba(255,255,255,.2);stroke-width:2;stroke-dasharray:4 5}
.card.run #R2 .tread{animation:tread 1s linear 3 both}
@keyframes tread{ to{stroke-dashoffset:-18} }

/* ══ R3 · 얼기설기 발명품 ══ */
#R3 .rig{transform-origin:150px 190px}
.card.run #R3 .rig{animation:rattle 4s ease-in-out 1 both}
#R3 .gear{transform-origin:center;transition:transform .5s}
.card.run #R3 .gear{animation:gear 1.9s cubic-bezier(.4,0,.6,1) 2 both}
@keyframes gear{ 0%{transform:rotate(0)} 35%{transform:rotate(112deg)} 45%{transform:rotate(104deg)} 100%{transform:rotate(360deg)} }
#R3 .spring{stroke:rgba(255,255,255,.26);stroke-width:1.8;fill:none;stroke-linecap:round;transition:.4s}
.card.run #R3 .spring{stroke:var(--rust)}
#R3 .hammer{transform-origin:0 0}
.card.run #R3 .hammer{animation:hammer 1.3s var(--sp-flat) 3 both}
@keyframes hammer{ 0%,100%{transform:rotate(0)} 40%{transform:rotate(-38deg)} 62%{transform:rotate(9deg)} }

@media(prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;transition-duration:.01ms!important} }
</style>
</head>
<body>
<div class="wrap">
  <h1>분해봇 — 고장난 로봇 3안</h1>
  <p class="lead">월-E의 낡은 몸통과 월레스의 얼기설기 발명품, 그 결을 노렸습니다.
     평소엔 <b>고장난 인형처럼 늘어져</b> 있다가, 일감이 오면 <b>달그락달그락 —
     한 번 죽었다 되살아나</b> 기어이 결과물을 «퉤» 하고 뱉습니다.</p>

  <div class="allbar">
    <button data-all="ig">◉ 인스타 넣기 — 셋 다</button>
    <button data-all="yt">▶ 유튜브 넣기 — 셋 다</button>
    <button class="ghost" data-reset="1">처음으로</button>
    <s>흔들림은 «불규칙»하게 짰습니다 — 규칙적으로 흔들면 멀쩡한 기계로 보입니다</s>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
var IGDEF='<defs><linearGradient id="IGG" x1="0" y1="1" x2="1" y2="0">'+
  '<stop offset="0" stop-color="#FEDA75"/><stop offset=".22" stop-color="#FA7E1E"/>'+
  '<stop offset=".52" stop-color="#D62976"/><stop offset=".76" stop-color="#962FBF"/>'+
  '<stop offset="1" stop-color="#4F5BD5"/></linearGradient></defs>';
function port(x,y,kind,r){
  r=r||15;
  var col = kind==='yt' ? '#E0574B' : 'url(#IGG)';
  var ico = kind==='yt'
    ? '<path d="M-3 -4.2v8.4l6.9-4.2z" fill="#fff"/>'
    : '<g fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round">'+
      '<rect x="-6.1" y="-6.1" width="12.2" height="12.2" rx="3.9"/><circle r="2.8"/></g>'+
      '<circle cx="4.1" cy="-4.1" r="1" fill="#fff"/>';
  return '<g class="port '+kind+'" transform="translate('+x+','+y+')">'+
    '<rect x="'+(-r)+'" y="'+(-r)+'" width="'+(r*2)+'" height="'+(r*2)+'" rx="'+(r*.62)+'" fill="'+col+'"/>'+
    ico+'<text class="plabel" y="'+(r+13)+'" text-anchor="middle">'+(kind==='yt'?'유튜브':'인스타')+'</text></g>';
}
function clanks(){
  return '<text class="clank" x="72" y="196">달그락</text>'+
    '<text class="clank c2" x="212" y="176" text-anchor="end">덜컹</text>'+
    '<text class="clank c3" x="66" y="152">드르륵</text>';
}
function puffs(cx,cy){
  return '<g class="puff"><circle cx="'+cx+'" cy="'+cy+'" r="5" fill="rgba(255,255,255,.3)"/></g>'+
    '<g class="puff p2"><circle cx="'+(cx+9)+'" cy="'+(cy-4)+'" r="3.6" fill="rgba(255,255,255,.24)"/></g>'+
    '<g class="puff p3"><circle cx="'+(cx-7)+'" cy="'+(cy-2)+'" r="4.2" fill="rgba(255,255,255,.2)"/></g>';
}
var OUT = {
  yt:{g:'linear-gradient(150deg,#3a2f12,#1d1707)', t:'3초 안에 안 넘기게 하는 법', s:'원고 217자 · 구성 6칸'},
  ig:{g:'linear-gradient(150deg,#331a2e,#1a0d17)', t:'브이로그인데 왜 이건 터졌을까', s:'받아쓰기 412자 · 구성 5칸'}
};
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* R1 · 원본을 고장냈다 */
function sR1(){ return '<svg viewBox="0 0 300 296" id="R1">'+IGDEF+
  port(70,42,'yt')+port(230,42,'ig')+
  '<path class="pipe" d="M70 60 Q70 104 112 114"/><path class="pipe" d="M230 60 Q230 104 188 114"/>'+
  '<path class="feed yt" style="--len:98" stroke="#E0574B" d="M70 60 Q70 104 112 114"/>'+
  '<path class="feed ig" style="--len:98" stroke="#D62976" d="M230 60 Q230 104 188 114"/>'+
  clanks()+puffs(196,150)+
  '<g transform="translate(150,168) scale(1.16)"><g class="rob">'+
    '<text class="zzz" x="30" y="-46">z z</text>'+
    /* 꺾인 안테나 — 고장의 첫인상 */
    '<path class="antbent" d="M-2 -40 l-4 -12 l9 -4"/>'+
    /* 머리가 살짝 삐뚜름하다 */
    '<g class="neck" transform="rotate(-4)">'+
      '<rect x="-30" y="-38" width="60" height="46" rx="15" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.17)" stroke-width="1.6"/>'+
      '<circle class="eyeL" cx="-11" cy="-17" r="4.4"/><circle class="eyeR" cx="11" cy="-17" r="3.4"/>'+
      /* 금이 간 얼굴 */
      '<path d="M4 -30 l5 7 l-3 5" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1.1"/>'+
      '<rect x="-7" y="-4" width="12" height="3" rx="1.5" fill="rgba(255,255,255,.2)" transform="rotate(-5)"/>'+
    '</g>'+
    '<rect x="-22" y="12" width="44" height="30" rx="10" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.15)" stroke-width="1.5"/>'+
    /* 헐거운 나사 두 개 */
    '<circle class="bolt" cx="-15" cy="20" r="2"/><circle class="bolt" cx="15" cy="34" r="1.7"/>'+
    '<g class="sheet"><rect x="-16" y="46" width="32" height="24" rx="5" fill="rgba(200,241,105,.15)" stroke="var(--prod)" stroke-width="1.4"/>'+
    '<line x1="-10" y1="54" x2="10" y2="54" stroke="var(--prod)" stroke-width="1.5" stroke-linecap="round"/></g>'+
  '</g></g>'+
  /* 바닥에 빠져 굴러다니는 볼트 */
  '<g class="boltjump" transform="translate(196,258)"><circle class="bolt" r="3.4"/>'+
  '<circle r="1.3" fill="rgba(0,0,0,.5)"/></g>'+
  '</svg>'; }

/* R2 · 고물 상자 */
function sR2(){ return '<svg viewBox="0 0 300 296" id="R2">'+IGDEF+
  port(70,42,'yt')+port(230,42,'ig')+
  '<path class="pipe" d="M70 60 V96 Q70 112 90 112 H140"/><path class="pipe" d="M230 60 V96 Q230 112 210 112 H160"/>'+
  '<path class="feed yt" style="--len:124" stroke="#E0574B" d="M70 60 V96 Q70 112 90 112 H140"/>'+
  '<path class="feed ig" style="--len:124" stroke="#D62976" d="M230 60 V96 Q230 112 210 112 H160"/>'+
  clanks()+puffs(202,144)+
  '<g transform="translate(150,176)"><g class="rob">'+
    '<text class="zzz" x="34" y="-48">z z</text>'+
    /* 열린 뚜껑 — 경첩 하나가 나갔다 */
    '<g class="lid"><rect x="-26" y="-40" width="52" height="9" rx="3" fill="rgba(255,255,255,.09)" stroke="rgba(255,255,255,.2)" stroke-width="1.3"/></g>'+
    /* 상자 몸통 */
    '<rect x="-30" y="-30" width="60" height="52" rx="8" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.2)" stroke-width="1.6"/>'+
    '<rect class="rust" x="-30" y="4" width="60" height="18" rx="6"/>'+
    '<circle class="eyeL" cx="-11" cy="-12" r="5"/><circle class="eyeR" cx="11" cy="-12" r="3.2"/>'+
    /* 벗겨진 페인트 */
    '<path class="rust" d="M-24 -24 q7 5 13 0 q6-5 12 1 l0 6 l-25 1 z"/>'+
    /* 바퀴(궤도) */
    '<line class="tread" x1="-26" y1="30" x2="26" y2="30"/>'+
    '<circle cx="-19" cy="30" r="7" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1.6"/>'+
    '<circle cx="19" cy="30" r="7" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1.6"/>'+
    '<g class="sheet"><rect x="-17" y="44" width="34" height="25" rx="5" fill="rgba(200,241,105,.15)" stroke="var(--prod)" stroke-width="1.4"/>'+
    '<line x1="-11" y1="53" x2="11" y2="53" stroke="var(--prod)" stroke-width="1.5" stroke-linecap="round"/></g>'+
  '</g></g>'+
  '<g class="boltjump" transform="translate(104,262)"><rect class="bolt" x="-5" y="-2" width="10" height="4" rx="1.6"/></g>'+
  '</svg>'; }

/* R3 · 얼기설기 발명품 */
function sR3(){ return '<svg viewBox="0 0 300 296" id="R3">'+IGDEF+
  port(66,40,'yt')+port(234,40,'ig')+
  '<path class="pipe" d="M66 58 V88 Q66 102 86 102 H128"/><path class="pipe" d="M234 58 V88 Q234 102 214 102 H172"/>'+
  '<path class="feed yt" style="--len:118" stroke="#E0574B" d="M66 58 V88 Q66 102 86 102 H128"/>'+
  '<path class="feed ig" style="--len:118" stroke="#D62976" d="M234 58 V88 Q234 102 214 102 H172"/>'+
  clanks()+puffs(210,138)+
  '<g class="rig">'+
    /* 깔때기 */
    '<path d="M126 106 h48 l-11 20 h-26 z" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.24)" stroke-width="1.5"/>'+
    /* 스프링 */
    '<path class="spring" d="M150 126 q-9 5 0 10 q9 5 0 10 q-9 5 0 10 q9 5 0 10"/>'+
    /* 톱니 두 개 — 큰 것과 작은 것 */
    '<g transform="translate(112,182)"><g class="gear">'+
      '<circle r="17" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.26)" stroke-width="1.6"/>'+
      [0,1,2,3,4,5].map(function(i){ var a=i*60*Math.PI/180;
        return '<rect x="-2.6" y="-23" width="5.2" height="7" rx="1.4" fill="rgba(255,255,255,.26)" transform="rotate('+(i*60)+')"/>';
      }).join('')+'<circle r="3.6" fill="rgba(0,0,0,.5)"/>'+
    '</g></g>'+
    '<g transform="translate(140,196)"><g class="gear" style="animation-direction:reverse">'+
      '<circle r="10" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.22)" stroke-width="1.4"/>'+
      [0,1,2,3].map(function(i){
        return '<rect x="-2" y="-15" width="4" height="5.5" rx="1.2" fill="rgba(255,255,255,.22)" transform="rotate('+(i*90)+')"/>';
      }).join('')+'<circle r="2.4" fill="rgba(0,0,0,.5)"/>'+
    '</g></g>'+
    /* 망치 — 옆에서 툭툭 친다 */
    '<line x1="196" y1="150" x2="196" y2="196" stroke="rgba(255,255,255,.16)" stroke-width="1.6"/>'+
    '<g transform="translate(196,158)"><g class="hammer">'+
      '<line x1="0" y1="0" x2="-26" y2="16" stroke="rgba(255,255,255,.28)" stroke-width="2.4" stroke-linecap="round"/>'+
      '<rect x="-36" y="10" width="14" height="10" rx="2.5" fill="rgba(255,255,255,.22)"/>'+
    '</g></g>'+
    /* 출구 상자 */
    '<rect x="118" y="212" width="64" height="30" rx="7" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,.24)" stroke-width="1.5"/>'+
    '<text x="150" y="232" text-anchor="middle" font-size="9" font-weight="800" fill="var(--tx3)">출구</text>'+
  '</g>'+
  '<g transform="translate(150,262)"><g class="sheet">'+
    '<rect x="-17" y="-11" width="34" height="24" rx="5" fill="rgba(200,241,105,.15)" stroke="var(--prod)" stroke-width="1.4"/>'+
    '<line x1="-11" y1="-2" x2="11" y2="-2" stroke="var(--prod)" stroke-width="1.5" stroke-linecap="round"/>'+
  '</g></g>'+
  '<g class="boltjump" transform="translate(86,258)"><circle class="bolt" r="3.2"/></g>'+
  '</svg>'; }

var ANS=[
  {id:'R1', nm:'R1 · 고장난 원본', sub:'그 로봇 그대로인데 안테나가 꺾이고 목이 삐뚜름. 나사가 빠져 바닥에 굴러다닌다'},
  {id:'R2', nm:'R2 · 고물 (월-E 결)', sub:'녹슨 상자 몸통에 궤도 바퀴. 경첩 나간 뚜껑이 덜컹덜컹 여닫힌다'},
  {id:'R3', nm:'R3 · 얼기설기 발명품', sub:'깔때기·스프링·톱니·망치가 억지로 물려 돌아간다. 월레스의 그 장치'}
];
var SCENES={R1:sR1,R2:sR2,R3:sR3};
document.getElementById('grid').innerHTML = ANS.map(function(a){
  return '<section class="card" data-an="'+a.id+'">'+
    '<div class="chd"><b>'+a.nm+'</b><s>'+a.sub+'</s></div>'+
    '<div class="ctl"><button class="yt" data-run="'+a.id+'|yt">▶ 유튜브</button>'+
    '<button class="ig" data-run="'+a.id+'|ig">◉ 인스타</button></div>'+
    '<div class="scene">'+SCENES[a.id]()+'</div>'+
    '<p class="state">고장난 채 멈춰 있음</p>'+
    '<div class="out"><div class="outempty">여기로 결과가 나옵니다</div></div>'+
    '</section>';
}).join('');

var T={};
function reset(id){
  var c=document.querySelector('[data-an="'+id+'"]'); if(!c) return;
  clearTimeout(T[id]); clearTimeout(T[id+'b']); clearTimeout(T[id+'c']);
  c.classList.remove('run','done');
  c.querySelectorAll('.feed').forEach(function(f){ f.classList.remove('on'); });
  c.querySelectorAll('.port').forEach(function(p){ p.classList.remove('on'); });
  c.querySelector('.state').textContent='고장난 채 멈춰 있음';
  c.querySelector('.out').innerHTML='<div class="outempty">여기로 결과가 나옵니다</div>';
  c.querySelectorAll('.ctl button').forEach(function(b){ b.disabled=false; });
}
function run(id, kind){
  var c=document.querySelector('[data-an="'+id+'"]'); if(!c) return;
  reset(id);
  var ig=kind==='ig', dur= ig?4600:3200;
  c.querySelectorAll('.ctl button').forEach(function(b){ b.disabled=true; });
  c.querySelector('.port.'+kind).classList.add('on');
  c.querySelector('.feed.'+kind).classList.add('on');
  void c.offsetWidth; c.classList.add('run');
  c.querySelector('.state').textContent='끄응… 덜컹덜컹';
  T[id]=setTimeout(function(){ c.querySelector('.state').textContent='어… 멈췄나?'; }, Math.round(dur*.42));
  T[id+'c']=setTimeout(function(){ c.querySelector('.state').textContent='다시 부르릉! '+(ig?'받아쓰는 중…':'읽는 중…'); }, Math.round(dur*.58));
  T[id+'b']=setTimeout(function(){
    c.classList.remove('run'); c.classList.add('done');
    c.querySelector('.state').textContent='…해냈습니다';
    var o=OUT[kind];
    c.querySelector('.out').innerHTML='<div class="outcard"><i style="background:'+o.g+'"></i>'+
      '<div class="tt"><b>'+esc(o.t)+'</b><s>'+esc(o.s)+'</s></div></div>';
    c.querySelectorAll('.ctl button').forEach(function(b){ b.disabled=false; });
  }, dur);
}
document.addEventListener('click', function(e){
  var r=e.target.closest('[data-run]');
  if(r){ var p=r.dataset.run.split('|'); run(p[0],p[1]); return; }
  var a=e.target.closest('[data-all]');
  if(a){ ANS.forEach(function(x){ run(x.id, a.dataset.all); }); return; }
  if(e.target.closest('[data-reset]')){ ANS.forEach(function(x){ reset(x.id); }); return; }
});
</script>
</body>
</html>
