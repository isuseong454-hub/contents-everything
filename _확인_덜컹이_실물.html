<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>덜컹이 — 앱 실물 확인</title>
<style>
:root{ --tx1:#EDF0F6; --tx2:#8B93A3; --tx3:#5A6272;
  --glass:rgba(255,255,255,.035); --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.15);
  --prod:#C8F169; --spring:cubic-bezier(.32,1.4,.36,1); }
*{box-sizing:border-box}
html,body{margin:0;color:var(--tx1);font:100%/1.5 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif}
body{background:radial-gradient(120% 70% at 50% 0%,#0d1017,#070910 54%,#050609);min-height:100vh;padding:24px 16px 60px}
.wrap{max-width:520px;margin:0 auto}
h1{font-size:20px;margin:0 0 6px;letter-spacing:-.02em}
.lead{color:var(--tx2);font-size:12.5px;line-height:1.65;margin:0 0 18px}
.lead b{color:var(--prod)}
.bar{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}
.bar button{font-family:inherit;font-size:12.5px;font-weight:800;padding:10px 16px;border-radius:11px;cursor:pointer;
  background:var(--prod);border:none;color:#06080c}
.bar button.ghost{background:var(--glass);border:1px solid var(--line2);color:var(--tx2)}
.big{transform:scale(2.6);transform-origin:left top;width:38.5%;margin-bottom:150px}
.note{font-size:11px;color:var(--tx3);line-height:1.6;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
/* ↓↓↓ 여기부터는 index.html 에서 «그대로 뽑아온» 것 ↓↓↓ */
.bot{display:flex;gap:12px;align-items:center;margin:0 0 12px;padding:11px 13px;border-radius:15px;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.012));border:1px solid var(--line)}
.bot.on{border-color:rgba(201,138,91,.34);background:rgba(201,138,91,.06)}
.bot.ok{border-color:rgba(200,241,105,.3);background:rgba(200,241,105,.05)}
.bot svg{width:74px;height:74px;flex:none;overflow:visible}
.bot .bi{min-width:0;flex:1}
/* 이름표는 로봇 «바로 아래» — 애착은 이름에서 온다 */
.bot .bfig{margin:0;flex:none;display:flex;flex-direction:column;align-items:center;gap:2px}
.bot .bfig figcaption{text-align:center;line-height:1.25}
.bot .bfig b{display:block;font-size:11.5px;font-weight:800;letter-spacing:-.01em}
.bot .bfig s{display:block;text-decoration:none;font-size:9px;font-weight:700;color:var(--tx3)}
.bot.on .bfig s{color:#C98A5B} .bot.ok .bfig s{color:var(--prod)}
.bot .bi p{margin:3px 0 0;font-size:10.5px;color:var(--tx3);line-height:1.5}
.bot.on .bi p{color:#C98A5B} .bot.ok .bi p{color:var(--prod)}
.bot .ba{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.bot .ba button{font-family:inherit;font-size:10.5px;font-weight:800;padding:5px 10px;border-radius:8px;cursor:pointer;
  background:var(--glass);border:1px solid rgba(200,241,105,.3);color:var(--prod)}
.bot .ba button:active{transform:scale(.96)}
.bot .ba button[disabled]{opacity:.5;cursor:default}
body.phone .bot .ba{display:none}          /* 폰엔 금고가 없다 — 눌러도 안 되는 버튼은 숨긴다 */
body.phone .bot .bi p.ph{display:block}
.bot .bi p.ph{display:none;color:var(--tx3)}
@keyframes botrattle{
  0%{transform:rotate(0) translate(0,0)}      7%{transform:rotate(-2.6deg) translate(-1.2px,.8px)}
  14%{transform:rotate(1.8deg) translate(1px,-.4px)}   21%{transform:rotate(-1deg) translate(-.6px,1px)}
  26%{transform:rotate(2.6deg) translate(1.2px,.4px)}  33%{transform:rotate(-1.4deg) translate(-.8px,-.6px)}
  40%,50%{transform:rotate(1.4deg) translate(.6px,2px)}          /* 여기서 한 번 죽는다 */
  58%{transform:rotate(-3.2deg) translate(-1.6px,-.8px)}
  66%{transform:rotate(-8.2deg) translate(-3.8px,-1.2px)}        /* 안테나가 부러진 «직후» 크게 휘청 */
  73%{transform:rotate(6deg) translate(3.2px,1.6px)}   80%{transform:rotate(-5deg) translate(-2.6px,-.8px)}
  87%{transform:rotate(3.4deg) translate(1.8px,1.2px)} 94%{transform:rotate(-1.6deg) translate(-1px,.5px)}
  100%{transform:rotate(0) translate(0,0)}
}

.bot .rob{transform-origin:0 30px}
.bot.on .rob{animation:botrattle 3.4s ease-in-out infinite both}
.bot .eyeL,.bot .eyeR{fill:#2a3040;transition:fill .3s}
/* 눈 — 주황으로 네 번 지직대다 켜진 채 버틴다. 초록은 «물건이 나올 때»만(.ok) */
.bot.on .eyeL,.bot.on .eyeR{animation:boteye 3.4s steps(1,end) infinite both}
.bot.on .eyeR{animation-delay:.12s}          /* 오른쪽이 아주 살짝 늦다 */
@keyframes boteye{
  0%,6%{fill:#2a3040}    8%,11%{fill:#C98A5B}  13%,21%{fill:#2a3040}
  23%,26%{fill:#C98A5B}  28%,33%{fill:#2a3040}
  35%,41%{fill:#C98A5B}  43%,47%{fill:#2a3040}
  49%,56%{fill:#C98A5B}  58%,61%{fill:#2a3040}
  63%,100%{fill:#C98A5B} }
.bot.ok .eyeL,.bot.ok .eyeR{fill:var(--prod)}
/* 부품 낙하 — 깨어날 때 «딱 한 번», 그리고 «하나씩 차례로» 빠진다
   ┌ 22% 나사가 툭        ┌ 62% 안테나가 뚝 → 곧바로 크게 휘청
   └─────────────────────┴──────────────────────────────────  (한 바퀴 3.4초) */
/* ⚠️ SVG는 회전 기준점이 화면 한가운데가 기본 — fill-box 로 부품 자신에 묶는다 */
.bot .pOn,.bot .pFall{transform-box:fill-box;transform-origin:50% 50%}
.bot.ok .pOn{opacity:0}
/* ── ① 나사 : 먼저 덜덜 떨다 22%에 빠진다 ── */
.bot.on .pOnB{animation:botponB 3.4s ease-in-out 1 both}
@keyframes botponB{
  0%{opacity:1;transform:translate(0,0) rotate(0)}
  6%{transform:translate(.3px,0) rotate(2deg)}      10%{transform:translate(-.3px,.2px) rotate(-2.5deg)}
  14%{transform:translate(.4px,-.2px) rotate(4deg)} 18%{transform:translate(-.5px,.3px) rotate(-4.5deg)}
  21.4%{opacity:1;transform:translate(.4px,.5px) rotate(7deg)}
  21.5%,100%{opacity:0;transform:translate(.4px,.5px) rotate(7deg)} }
.bot .pHole{opacity:0}
.bot.on .pHole{animation:botphole 3.4s steps(1,end) 1 both}
@keyframes botphole{ 0%,21.4%{opacity:0} 21.5%,100%{opacity:1} }
.bot.ok .pHole{opacity:1}
.bot.on .pfB{animation:botfallB 3.4s 1 both}
.bot.ok .pfB{opacity:1;transform:translate(5px,16px) rotate(150deg)}
@keyframes botfallB{
  0%,21.4%{opacity:0;transform:translate(0,0) rotate(0)} 21.5%{opacity:1;transform:translate(0,0) rotate(0)}
  31%{transform:translate(3px,16px) rotate(74deg)}    35%{transform:translate(3.8px,11px) rotate(106deg)}
  39%{transform:translate(4.4px,16px) rotate(130deg)} 42%{transform:translate(4.7px,14px) rotate(141deg)}
  46%,100%{opacity:1;transform:translate(5px,16px) rotate(150deg)} }
/* ── ② 안테나 : 한참 버티다 62%에 부러진다 ── */
.bot.on .pOnA{animation:botponA 3.4s ease-in-out 1 both}
@keyframes botponA{
  0%,42%{opacity:1;transform:translate(0,0) rotate(0)}
  46%{transform:translate(.3px,0) rotate(3deg)}      50%{transform:translate(-.3px,.2px) rotate(-4deg)}
  54%{transform:translate(.4px,-.2px) rotate(6deg)}  58%{transform:translate(-.5px,.3px) rotate(-7deg)}
  61.4%{opacity:1;transform:translate(.5px,.6px) rotate(11deg)}
  61.5%,100%{opacity:0;transform:translate(.5px,.6px) rotate(11deg)} }
.bot.on .pfA{animation:botfallA 3.4s 1 both}
/* 결과물 종이 위에 겹치면 안 된다 — 왼쪽 바닥으로 비켜 떨어진다 */
.bot.ok .pfA{opacity:1;transform:translate(-19.5px,76px) rotate(196deg)}
@keyframes botfallA{
  0%,61.4%{opacity:0;transform:translate(0,0) rotate(0)} 61.5%{opacity:1;transform:translate(0,0) rotate(0)}
  76%{transform:translate(-11.7px,76px) rotate(140deg)} 82%{transform:translate(-15px,67px) rotate(168deg)}
  88%{transform:translate(-18px,76px) rotate(186deg)}   92%{transform:translate(-19px,72px) rotate(192deg)}
  96%,100%{opacity:1;transform:translate(-19.5px,76px) rotate(196deg)} }
.bot .pFall{opacity:0}
.bot .zzz{fill:var(--tx3);font:800 10px/1 system-ui;transition:opacity .3s}
.bot.on .zzz,.bot.ok .zzz{opacity:0}
.bot .sheet{opacity:0}
.bot.ok .sheet{animation:botsheet .6s var(--spring) 1 both}
@keyframes botsheet{ 0%{opacity:0;transform:translateY(-9px) rotate(-9deg)}
  60%{transform:translateY(2px) rotate(4deg)} 100%{opacity:1;transform:none} }
</style></head>
<body><div class="wrap">
  <h1>덜컹이 — 앱 실물 확인</h1>
  <p class="lead">이 페이지의 로봇과 CSS는 <b>index.html 에서 그대로 뽑아온 것</b>입니다. 베낀 게 아니라서 앱과 어긋날 수 없습니다.
     <b>깨우기</b>를 누르면 나사가 빠지고 안테나가 부러집니다.</p>

  <div class="bar">
    <button data-go="on">깨우기 (일 시작)</button>
    <button class="ghost" data-go="ok">끝났다 (물건 나옴)</button>
    <button class="ghost" data-go="">재우기 (부품 다시 붙음)</button>
  </div>

  <p class="note">아래는 <b>앱에서 보이는 실제 크기</b>입니다</p>
  <div id="one"></div>
  <p class="note">아래는 같은 것을 <b>2.6배로 키운 것</b> — 부품이 어디서 빠지는지 보려고</p>
  <div class="big"><div id="two"></div></div>
</div>
<script>
var BOT_NAME='덜컹이', BOT_TITLE='고장난 로봇';
function botSVG(){
  return '<svg viewBox="0 0 96 96" aria-hidden="true"><g transform="translate(48,44)"><g class="rob">'+
    '<text class="zzz" x="24" y="-26">z z</text>'+
    /* 안테나 — 밑동은 남고 위쪽이 부러져 떨어진다 */
    '<path d="M-2 -26 l-2.6 -5.85" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1.8" stroke-linecap="round"/>'+
    '<g transform="translate(-4.6,-31.85)"><g class="pOn pOnA">'+
      '<path d="M0 0 l-1.4 -3.15 l7 -3" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1.8" stroke-linecap="round"/>'+
    '</g></g>'+
    '<g transform="rotate(-4)">'+
      '<rect x="-22" y="-25" width="44" height="33" rx="11" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.2)" stroke-width="1.5"/>'+
      '<circle class="eyeL" cx="-8" cy="-11" r="3.4"/><circle class="eyeR" cx="8" cy="-11" r="3.4"/>'+
      '<path d="M3 -20 l4 5 l-2 4" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1"/>'+
      '<rect x="-5" y="-2" width="9" height="2.4" rx="1.2" fill="rgba(255,255,255,.22)" transform="rotate(-5)"/>'+
    '</g>'+
    '<rect x="-16" y="10" width="32" height="21" rx="7" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,.16)" stroke-width="1.4"/>'+
    '<circle cx="-11" cy="16" r="1.5" fill="rgba(255,255,255,.22)"/>'+
    /* 나사 — 있던 자리에서 빠지고, 그 자리엔 구멍이 남는다 */
    '<g class="pHole"><circle cx="11" cy="26" r="1.7" fill="rgba(0,0,0,.45)" stroke="rgba(255,255,255,.13)" stroke-width=".8"/></g>'+
    '<g transform="translate(11,26)"><g class="pOn pOnB">'+
      '<circle cx="0" cy="0" r="1.5" fill="rgba(255,255,255,.3)"/>'+
      '<line x1="-.9" y1="0" x2=".9" y2="0" stroke="rgba(0,0,0,.4)" stroke-width=".6"/></g></g>'+
    '<g class="sheet"><rect x="-12" y="33" width="24" height="17" rx="4" fill="rgba(200,241,105,.15)" stroke="var(--prod)" stroke-width="1.2"/>'+
    '<line x1="-7" y1="39" x2="7" y2="39" stroke="var(--prod)" stroke-width="1.3" stroke-linecap="round"/></g>'+
  '</g></g>'+
  /* ⚠️ 여기부터는 .rob «밖» — 떨어진 부품이 몸을 따라 흔들리면 안 된다 */
  '<g transform="translate(59,70)"><g class="pFall pfB">'+
    '<circle cx="0" cy="0" r="1.5" fill="rgba(255,255,255,.3)"/>'+
    '<line x1="-.9" y1="0" x2=".9" y2="0" stroke="rgba(0,0,0,.4)" stroke-width=".6"/></g></g>'+
  '<g transform="translate(43.4,12.15)"><g class="pFall pfA">'+
    '<path d="M0 0 l-1.4 -3.15 l7 -3" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1.8" stroke-linecap="round"/></g></g>'+
  '</svg>';
}
function paint(mood){
  var h='<div class="bot'+(mood?' '+mood:'')+'">'+
    '<figure class="bfig">'+botSVG()+'<figcaption><b>'+BOT_NAME+'</b><s>'+BOT_TITLE+'</s></figcaption></figure>'+
    '<div class="bi"><p class="bstate">'+
      (mood==='on'?'끄응… 자막 읽는 중…':mood==='ok'?'…해냈습니다':'자는 중 — 링크를 담으면 깨어납니다')+
    '</p></div></div>';
  document.getElementById('one').innerHTML=h;
  document.getElementById('two').innerHTML=h;
}
paint('');
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-go]'); if(!b) return;
  paint(b.dataset.go);
});
</script></body></html>
